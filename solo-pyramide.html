<style>
* { box-sizing: border-box; }
html, body {

.card:hover {

<script type="module">
const pyramidEl = document.getElementById('pyramid');
const infoBoxEl = document.getElementById('infoBoxContainer');
const titleEl = document.getElementById('headerTitle');
const subtitleEl = document.getElementById('headerSubtitle');
const ovEl = document.getElementById('ov');
const mcEl = document.getElementById('mc');
const sideNavEl = document.getElementById('sideNavContainer');
const adminNavBtn = document.getElementById('adminNavBtn');
const infoSystemNavBadge = document.getElementById('infoSystemNavBadge');
const topRightLoginInfoBox = document.getElementById('topRightLoginInfoBox');
const logoutNavBtn = document.getElementById('logoutNavBtn');

// V15.27: Betriebsarten für Whiteboard und zentrale EC-Wegscheid-Verwaltung.
// Whiteboard: ?mode=whiteboard oder ?whiteboard=1 -> keine separate Anmeldung.
// Verwaltung: ?mode=admin-embedded -> übernimmt ausschließlich eine bereits
// angemeldete Administrator-Sitzung aus der übergeordneten Vereinsverwaltung.
const APP_URL_PARAMS = new URLSearchParams(window.location.search);
const WHITEBOARD_MODE = APP_URL_PARAMS.get('mode') === 'whiteboard' || APP_URL_PARAMS.get('whiteboard') === '1';
const ADMIN_EMBED_MODE = APP_URL_PARAMS.get('mode') === 'admin-embedded';
const INTEGRATED_HOSTED_MODE = location.hostname === 'ecwegscheid.github.io' &&
  /^\/Vereinsverwaltung-Aktuell\/solo-pyramide\.html$/i.test(location.pathname);


function hasCentralAdminParent(){
  if(!ADMIN_EMBED_MODE || window.parent === window) return false;
  try {
    if(window.parent.location.origin !== window.location.origin) return false;
    return !!(window.parent.firebaseAuthUser && window.parent.appPermissions?.admin === true);
  } catch(e) {
    return false;
  }
}

const ABSOLUTE_MAX_PLAYERS = 44;
const HOUR = 60 * 60 * 1000;
const DAY = 24 * HOUR;
const MAX_VACATION_DAYS = 14;

const defaultTitle = "Solo Pyramide 2026";
const defaultSubtitle = "EC Wegscheid";
const defaultPassword = "081500";
const defaultInfoSystemPassword = "081500";
const defaultPyramidSize = 28;

const defaultRuleLockHoursAfterGame = 24; 
const defaultRuleChallengeDays = 10;      
const defaultRuleWithdrawHours = 24;      

const defaultInfoText = [
  "Bitte zuerst eigenen Namen anklicken.",
  "Sämtliche mögliche Gegner werden angezeigt.",
  "Auswahl ob Forderung fixieren oder Ergebnis eintragen.",
  "Nach Fixierung der Forderung werden die Spieler gesperrt.",
  "Je nach Eingabe des Ergebnisses werden die Namen eventuell getauscht oder bleiben bestehen."
];

const defaults = [
  'Stadler Martin','Resch Michael','Pendelin Manuel','Freund Johannes','Freund Heiner',
  'Höglinger Paul','Münichshofer Timo','Freund Stefan','Fesl Thomas','Simml Lothar',
  'Höglinger Heinz','Kasberger Tobias','Gottinger Klaus','Fesl Simon','Breitenfellner Paul',
  'Hellauer Manfred','Resch Daniel','Ledermüller Michael','Hofmann Günter','Hellauer Herbert',
  'Allmannsberger Adi','Schaubschläger Thomas','Simml Felix','Breitenfellner Thomas','Eberhardt Christian',
  'Haselbeck Wolfgang','Hellauer Mathias','Steininger Jürgen','Perr Herbert','Krause Joachim',
  'Schichl Josef','Dobretsberger Michael','Heidinger Günter'
];
while(defaults.length < ABSOLUTE_MAX_PLAYERS) defaults.push('FREI');
defaults.length = ABSOLUTE_MAX_PLAYERS;

let players = [...defaults];
let passwords = {};
defaults.forEach(p => { if(p !== 'FREI') passwords[p] = "1234"; });

let hist = [];
let challengerLocks = {};
let opponentLocks = {};
let fixedChallenges = [];
let infoLines = [...defaultInfoText];
let customTitle = defaultTitle;
let customSubtitle = defaultSubtitle;
let adminPassword = defaultPassword;
let infoSystemPassword = defaultInfoSystemPassword;
let currentMaxPlayers = defaultPyramidSize;
let vacations = {};

let ruleLockHoursAfterGame = defaultRuleLockHoursAfterGame;
let ruleChallengeDays = defaultRuleChallengeDays;
let ruleWithdrawHours = defaultRuleWithdrawHours;

let selected = null;
let pending = null;
let currentSession = null;

// V15.27: Login-Session auf diesem Gerät merken.
// Es wird nur Benutzername/Rolle gespeichert, niemals das Passwort.
const SESSION_STORAGE_KEY = 'soloPyramide_session_v1';
try {
  const savedSession = localStorage.getItem(SESSION_STORAGE_KEY);
  if (savedSession) {
    const parsedSession = JSON.parse(savedSession);
    if (parsedSession && ['player','admin','infosystem'].includes(parsedSession.type)) {
      currentSession = parsedSession;
    }
  }
} catch (e) {
  localStorage.removeItem(SESSION_STORAGE_KEY);
}

// Im Whiteboard-Modus wird bewusst keine Anmeldung verlangt.
// Im eingebetteten Verwaltungsmodus wird die vorhandene zentrale Admin-Anmeldung
// übernommen; ein zweites Solo-Pyramide-Passwort wird dann nicht abgefragt.
if (WHITEBOARD_MODE) {
  currentSession = { type: 'whiteboard', name: null };
} else if (hasCentralAdminParent()) {
  currentSession = { type: 'admin', name: null, embeddedCentralAdmin: true };
}

function persistSession() {
  try {
    // Der Whiteboard-Modus wird ausschließlich über die URL aktiviert.
    // Dadurch entsteht auf normalen Geräten kein dauerhaft angemeldeter Whiteboard-Benutzer.
    if (currentSession && (currentSession.type === 'whiteboard' || currentSession.embeddedCentralAdmin)) return;
    if (currentSession) localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(currentSession));
    else localStorage.removeItem(SESSION_STORAGE_KEY);
  } catch (e) {}
}

let dbRef = null;
let useFirebase = false;
let centralBackend = '';
let centralSetDoc = null;
let centralStateSeen = false;
let legacyMigrationTried = false;

const CENTRAL_FIREBASE_CONFIG = {
  apiKey: "AIzaSyDmK54G30_JK8ma8tJ7YWyza-OrdrUC24I",
  authDomain: "ec-wegscheid-verwaltung-neu.firebaseapp.com",
  projectId: "ec-wegscheid-verwaltung-neu",
  storageBucket: "ec-wegscheid-verwaltung-neu.firebasestorage.app",
  messagingSenderId: "558472054725",
  appId: "1:558472054725:web:10145e2d8d6f168b056dac"
};
const CENTRAL_COLLECTION = 'soloPyramide';
const CENTRAL_DOCUMENT = 'state';
const LEGACY_RTDB_URL = 'https://solo-pyramide-wegscheid-2026-default-rtdb.europe-west1.firebasedatabase.app/pyramideData/state_v3.json';

function applyData(data){
  if(data){
    if(Array.isArray(data.players)) players = data.players;
    if(data.passwords) passwords = data.passwords;
    if(Array.isArray(data.hist)) hist = data.hist;
    if(data.challengerLocks) challengerLocks = data.challengerLocks;
    if(data.opponentLocks) opponentLocks = data.opponentLocks;
    if(Array.isArray(data.fixedChallenges)) fixedChallenges = data.fixedChallenges;
    if(Array.isArray(data.infoLines)) infoLines = data.infoLines;
    if(data.customTitle) customTitle = data.customTitle;
    if(data.customSubtitle) customSubtitle = data.customSubtitle;
    if(data.adminPassword) adminPassword = data.adminPassword;
    if(data.infoSystemPassword) infoSystemPassword = data.infoSystemPassword;
    if(data.currentMaxPlayers) currentMaxPlayers = data.currentMaxPlayers;
    if(data.vacations) vacations = data.vacations;
    if(data.ruleLockHoursAfterGame !== undefined) ruleLockHoursAfterGame = data.ruleLockHoursAfterGame;
    if(data.ruleChallengeDays !== undefined) ruleChallengeDays = data.ruleChallengeDays;
    if(data.ruleWithdrawHours !== undefined) ruleWithdrawHours = data.ruleWithdrawHours;
  }
  checkLoginOrRender();
}

function buildPayload(){
  // Admin- und Informationssystem-Passwörter werden bewusst NICHT im öffentlich lesbaren
  // zentralen Solo-Dokument gespeichert. Der Adminzugang läuft über die Vereinsverwaltung.
  return {
    players, passwords, hist, challengerLocks, opponentLocks, fixedChallenges,
    infoLines, customTitle, customSubtitle,
    currentMaxPlayers, vacations, ruleLockHoursAfterGame,
    ruleChallengeDays, ruleWithdrawHours,
    appVersion: '15.27',
    updatedAt: new Date().toISOString()
  };
}

const localFallback = localStorage.getItem('pyramideData_fallback_v3');
if(localFallback){
  try { applyData(JSON.parse(localFallback)); } catch(e){}
} else {
  players.forEach(p => { if(p !== 'FREI' && !passwords[p]) passwords[p] = "1234"; });
  checkLoginOrRender();
}

async function tryLegacyMigration(){
  if(legacyMigrationTried) return false;
  legacyMigrationTried = true;
  try{
    const res = await fetch(LEGACY_RTDB_URL, {cache:'no-store'});
    if(!res.ok) return false;
    const data = await res.json();
    if(!data || !Array.isArray(data.players)) return false;
    applyData(data);
    localStorage.setItem('pyramideData_fallback_v3', JSON.stringify(data));
    try{
      if(useFirebase && dbRef) await centralWrite(buildPayload());
    }catch(e){
      console.warn('Altdaten konnten noch nicht in das zentrale Firebase geschrieben werden:', e);
    }
    return true;
  }catch(e){
    console.warn('Altes Solo-Pyramide-Firebase konnte nicht gelesen werden:', e);
    return false;
  }
}

async function centralWrite(payload){
  if(!useFirebase || !dbRef) return false;
  if(centralBackend === 'parent-compat'){
    await dbRef.set(payload);
    return true;
  }
  if(centralBackend === 'module' && centralSetDoc){
    await centralSetDoc(dbRef, payload);
    return true;
  }
  return false;
}

async function handleCentralSnapshot(exists, data){
  centralStateSeen = true;
  if(exists && data){
    applyData(data);
    localStorage.setItem('pyramideData_fallback_v3', JSON.stringify(data));
    return;
  }
  // Beim ersten Einsatz automatisch die vorhandenen Daten aus dem früheren
  // Solo-Pyramide-Firebase übernehmen. Falls dort nichts liegt, bleibt der
  // lokale/default Stand aktiv und wird beim nächsten Speichern zentral angelegt.
  const migrated = await tryLegacyMigration();
  if(!migrated && hasCentralAdminParent()){
    try{ await centralWrite(buildPayload()); }catch(e){ console.warn('Zentraler Erststand konnte nicht angelegt werden:', e); }
  }
}

async function initCentralFirebase(){
  try{
    // Eingebettet in die Vereinsverwaltung: deren bereits initialisierte
    // Firestore-/Admin-Sitzung direkt verwenden. So ist kein zweites Login nötig.
    if(window.parent !== window){
      try{
        if(window.parent.location.origin === window.location.origin && window.parent.firestoreDb){
          dbRef = window.parent.firestoreDb.collection(CENTRAL_COLLECTION).doc(CENTRAL_DOCUMENT);
          centralBackend = 'parent-compat';
          useFirebase = true;
          dbRef.onSnapshot(
            snap => handleCentralSnapshot(snap.exists, snap.exists ? snap.data() : null),
            err => {
              console.error('Zentrales Firebase (Solo Pyramide):', err);
              if(!centralStateSeen) tryLegacyMigration();
            }
          );
          return true;
        }
      }catch(e){}
    }

    // Direkter Aufruf auf Smartphone/PC: gleiches zentrales Firebase-Projekt,
    // ohne zusätzliche Firebase-Anmeldung. Die Spieleranmeldung bleibt wie bisher.
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
    const { getFirestore, doc, onSnapshot, setDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
    const app = initializeApp(CENTRAL_FIREBASE_CONFIG, 'soloPyramideCentral');
    const db = getFirestore(app);
    dbRef = doc(db, CENTRAL_COLLECTION, CENTRAL_DOCUMENT);
    centralSetDoc = (ref,payload)=>setDoc(ref,payload);
    centralBackend = 'module';
    useFirebase = true;
    onSnapshot(
      dbRef,
      snap => handleCentralSnapshot(snap.exists(), snap.exists() ? snap.data() : null),
      err => {
        console.error('Zentrales Firebase (Solo Pyramide):', err);
        if(!centralStateSeen) tryLegacyMigration();
      }
    );
    return true;
  }catch(err){
    console.warn("Zentrales Firebase wurde blockiert/Netzwerkfehler. App läuft mit lokalem/Altdaten-Fallback.", err);
    useFirebase = false;
    await tryLegacyMigration();
    return false;
  }
}
await initCentralFirebase();

window.save = function(){
  const payload = buildPayload();
  localStorage.setItem('pyramideData_fallback_v3', JSON.stringify(payload));

  if(useFirebase && dbRef){
    centralWrite(payload).catch((error) => {
      console.error("Firebase Speicherfehler (Solo Pyramide): ", error);
    });
  }
}

function showStatistics() {
  let stats = {};
  function getStat(name) {
    if (!stats[name]) { stats[name] = { played: 0, won: 0, lost: 0, setsWon: 0, setsLost: 0 }; }
    return stats[name];
  }
  if (Array.isArray(hist)) {
    hist.forEach(entry => {
      if (entry.includes(" besiegte ")) {
        const parts = entry.split(" - ");
        if (parts.length >= 2) {
          const matchPart = parts.slice(1).join(" - ");
          const match = matchPart.match(/^(.*?) besiegte (.*?) (\d+):(\d+)$/);
          if (match) {
            const winner = match[1].trim();
            const loser = match[2].trim();
            const winSets = parseInt(match[3], 10);
            const loseSets = parseInt(match[4], 10);
            const sWin = getStat(winner);
            sWin.played++; sWin.won++; sWin.setsWon += winSets; sWin.setsLost += loseSets;
            const sLose = getStat(loser);
            sLose.played++; sLose.lost++; sLose.setsWon += loseSets; sLose.setsLost += winSets;
          }
        }
      }
    });
  }

  let rowsHtml = '';
  const sortedPlayers = Object.keys(stats).sort((a, b) => {
    const diffA = stats[a].setsWon - stats[a].setsLost;
    const diffB = stats[b].setsWon - stats[b].setsLost;
    if (stats[b].won !== stats[a].won) return stats[b].won - stats[a].won;
    if (diffB !== diffA) return diffB - diffA;
    return stats[b].played - stats[a].played;
  });

  if (sortedPlayers.length === 0) {
    rowsHtml = '<tr><td colspan="5" style="text-align:center; color:#aaa; padding:15px;">Bisher wurden noch keine Spiele absolviert.</td></tr>';
  } else {
    sortedPlayers.forEach(name => {
      const st = stats[name];
      rowsHtml += `
        <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
          <td style="padding: 8px; font-weight: bold;">${escapeHtml(name)}</td>
          <td style="padding: 8px; text-align: center;">${st.played}</td>
          <td style="padding: 8px; text-align: center; color: #52c41a;">${st.won}</td>
          <td style="padding: 8px; text-align: center; color: #ff4d4f;">${st.lost}</td>
          <td style="padding: 8px; text-align: center; font-weight: bold; color: #ffd966;">${st.setsWon}:${st.setsLost}</td>
        </tr>
      `;
    });
  }

  modal(`
    <h2>Spieler-Statistik</h2>
    <p class="hint">Übersicht aller Spieler mit mindestens einem gespielten Spiel.</p>
    <div style="max-height: 350px; overflow-y: auto; margin-top: 10px; border: 1px solid #444; border-radius: 8px; background: #141419;">
      <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
        <thead>
          <tr style="background: #2a2a35; border-bottom: 1px solid #444; text-align: left;">
            <th style="padding: 8px;">Spieler</th>
            <th style="padding: 8px; text-align: center;">Gespielt</th>
            <th style="padding: 8px; text-align: center;">Gewonnen</th>
            <th style="padding: 8px; text-align: center;">Verloren</th>
            <th style="padding: 8px; text-align: center;">Sätze</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
    <div style="margin-top: 14px;"><button class="btn" onclick="closeM()">Schließen</button></div>
  `);
}

window.setVacationAdminCustom = function(name, index){
  const startInput = document.getElementById('vacStart_' + index);
  const endInput = document.getElementById('vacEnd_' + index);
  if(!startInput || !startInput.value || !endInput || !endInput.value) { alert('Bitte Start- und Enddatum eingeben.'); return; }
  
  const startDate = new Date(startInput.value); startDate.setHours(0, 0, 0, 0);
  const endDate = new Date(endInput.value); endDate.setHours(23, 59, 59, 999);
  if(endDate.getTime() < startDate.getTime()){ alert('Das Enddatum darf nicht vor dem Startdatum liegen.'); return; }

  const diffDays = Math.ceil(Math.abs(endDate.getTime() - startDate.getTime()) / (1000 * 60 * 60 * 24));
  const vac = getPlayerVacationData(name);
  const remainingDays = MAX_VACATION_DAYS - vac.usedDays;

  if(diffDays > remainingDays){
    alert('Fehler: Dieser Urlaubszeitraum hat ' + diffDays + ' Tage. Der Spieler hat aber nur noch ' + remainingDays + ' Tage übrig!');
    return;
  }

  vac.usedDays += diffDays;
  vac.activeStart = startDate.getTime();
  vac.activeEnd = endDate.getTime();
  
  if(Array.isArray(fixedChallenges)){
    fixedChallenges.forEach(ch => {
      if(ch && ch.status === 'fixed' && (ch.challenger === name || ch.opponent === name)){
        ch.expiresAt += (diffDays * DAY);
      }
    });
  }

  addHist('Urlaub eingetragen für ' + name + ' (' + diffDays + ' Tage)');
  window.save();
  alert('Urlaub erfolgreich gespeichert!');
  openAdminMenu('vacation');
  render();
}

  const rLockH = parseFloat(document.getElementById('adminRuleLockHours').value);
  const rChalD = parseFloat(document.getElementById('adminRuleChallengeDays').value);
  const rWithH = parseFloat(document.getElementById('adminRuleWithdrawHours').value);

  if(!isNaN(rLockH) && rLockH >= 0) ruleLockHoursAfterGame = rLockH;
  if(!isNaN(rChalD) && rChalD > 0) ruleChallengeDays = rChalD;
  if(!isNaN(rWithH) && rWithH >= 0) ruleWithdrawHours = rWithH;

      players[i] = newName;
      if(oldName !== newName && oldName !== 'FREI'){
        if(passwords[oldName]){ passwords[newName] = passwords[oldName]; delete passwords[oldName]; }
        if(challengerLocks[oldName]){ challengerLocks[newName] = challengerLocks[oldName]; delete challengerLocks[oldName]; }
        if(vacations[oldName]){ vacations[newName] = vacations[oldName]; delete vacations[oldName]; }
        if(Array.isArray(fixedChallenges)){
          fixedChallenges = fixedChallenges.map(ch=>({ ...ch, challenger:ch.challenger===oldName?newName:ch.challenger, opponent:ch.opponent===oldName?newName:ch.opponent }));
        }
      }

    }

  window.save();
  renderHeader();
  renderInfoBox();
  closeM();
  render();
}

function isVacationActive(name){
  const vac = vacations[name];
  if(vac && vac.activeEnd && vac.activeEnd > Date.now()) return vac.activeEnd;
  return 0;
}

const pos = {};
let n = 1;
for(let r=1; n<=ABSOLUTE_MAX_PLAYERS; r++){
  for(let c=1; c<=r && n<=ABSOLUTE_MAX_PLAYERS; c++){
    pos[n] = {r, c};
    n++;
  }
}

function allowed(p){
  const me = pos[p];
  if(!me) return [];
  let a = [];
  for(let i=1; i<=currentMaxPlayers; i++){
    if(!pos[i]) continue;
    const o = pos[i];
    if(o.r === me.r && o.c < me.c) a.push(i);
    if(o.r === me.r-1 && o.c >= me.c) a.push(i);
  }
  return a.filter(x => {
    if(x <= 0 || x > currentMaxPlayers || players[x-1] === 'FREI') return false;
    const name = players[x-1];
    if(isVacationActive(name)) return false;
    return !activeFixedChallengeForName(name);
  });
}

function lockRemaining(name){ return Math.max(0, Number(challengerLocks[name]||0) - Date.now()); }
function lockText(ms){
  const totalMinutes = Math.ceil(ms/60000);
  const days = Math.floor(totalMinutes/1440);
  const hours = Math.floor((totalMinutes%1440)/60);
  const minutes = totalMinutes%60;
  return (days?days+' Tag(e) ':'')+(hours?hours+' Std. ':'')+(minutes?minutes+' Min.':'');
}
function pairKey(a,b){ return [a,b].sort().join(' || '); }
function opponentRemaining(a,b){ return Math.max(0, Number(opponentLocks[pairKey(a,b)]||0) - Date.now()); }

function activeFixedChallengeForName(name){ 
  if(!Array.isArray(fixedChallenges)) fixedChallenges = [];
  return fixedChallenges.find(ch => ch && ch.status==='fixed' && (ch.challenger===name || ch.opponent===name)); 
}

function cleanExpiredLocks(){
  let changed = false;
  for(const name in challengerLocks){ if(Number(challengerLocks[name]) <= Date.now()){ delete challengerLocks[name]; changed=true; } }
  for(const key in opponentLocks){ if(Number(opponentLocks[key]) <= Date.now()){ delete opponentLocks[key]; changed=true; } }
  
  if(!Array.isArray(fixedChallenges)) fixedChallenges = [];
  const now = Date.now();
  fixedChallenges = fixedChallenges.filter(ch => {
    if(!ch) return false;
    if(ch.status==='fixed' && Number(ch.expiresAt) <= now){
      if(!Array.isArray(hist)) hist = [];
      hist.unshift(new Date().toLocaleString('de-AT')+' - Forderung verfallen: '+ch.challenger+' gegen '+ch.opponent);
      changed = true;
      return false;
    }
    return true;
  });
  if(changed) window.save();
}

function editPlayerDirect(i){
  if(!currentSession || (currentSession.type !== 'admin' && currentSession.type !== 'infosystem')){
    const pw = prompt('Administrator-Passwort');
    if(pw !== adminPassword) return;
  }
  const old = players[i-1];
  const neu = prompt('Name für Platz ' + i, old==='FREI' ? '' : old);
  if(neu !== null){
    const name = neu.trim() ? neu.trim() : 'FREI';
    players[i-1] = name;
    if(old !== name){
      if(passwords[old]){ passwords[name] = passwords[old]; delete passwords[old]; }
      if(challengerLocks[old]){ challengerLocks[name] = challengerLocks[old]; delete challengerLocks[old]; }
      if(vacations[old]){ vacations[name] = vacations[old]; delete vacations[old]; }
      if(Array.isArray(fixedChallenges)){
        fixedChallenges = fixedChallenges.map(ch=>({ ...ch, challenger:ch.challenger===old?name:ch.challenger, opponent:ch.opponent===old?name:ch.opponent }));
      }
    }
    if(name !== 'FREI' && !passwords[name]) passwords[name] = "1234";
    window.save();
    render();
  }
}

function clickPlace(p){
 cleanExpiredLocks();
 const name = players[p-1];
 
 if(currentSession && currentSession.type === 'player'){
   const myName = currentSession.name;
   const myCurrentPlace = players.indexOf(myName) + 1;
   
   if(selected === null && p !== myCurrentPlace){
     alert(`Du bist als ${myName} angemeldet. Du kannst nur auf deinen eigenen Namen (Platz ${myCurrentPlace}) klicken, um eine Forderung zu starten!`);
     return;
   }
   
   if(selected === myCurrentPlace && p === myCurrentPlace){
     selected = null; render(); return;
   }
 }

 const running = activeFixedChallengeForName(name);
 if(running){
   pending = {
     from: players.indexOf(running.challenger) + 1,
     to: players.indexOf(running.opponent) + 1,
     challenger: running.challenger,
     opponent: running.opponent,
     fixedId: running.id
   };
   
   let actionButtons = '<button class="btn" onclick="showResultEntry()">Ergebnis eintragen</button>';
   const waText = encodeURIComponent(`Hallo ${running.opponent}, du wurdest in der Solo-Pyramide von ${running.challenger} gefordert! Bitte vereinbart einen Termin. (${window.location.href})`);
   actionButtons += `<a href="https://api.whatsapp.com/send?text=${waText}" target="_blank" style="text-decoration:none;"><button class="btn whatsappBtn" style="background:#25d366; color:#fff;">📱 Gegner per WhatsApp benachrichtigen</button></a>`;

   if(running.challenger === name || running.opponent === name || (currentSession && (currentSession.type === 'admin' || currentSession.type === 'infosystem'))){
     actionButtons += '<button class="btn btnDanger" onclick="withdrawChallenge(\'' + running.id + '\')">Forderung zurückziehen</button>';
   }
   actionButtons += '<button class="btn" onclick="cancelResult()">Abbrechen</button>';

   modal('<h3>Fixierte Forderung</h3><p class="hint">' + escapeHtml(running.challenger) + ' gegen ' + escapeHtml(running.opponent) + '</p><p class="hint">Aktiv für noch: <b>' + lockText(running.expiresAt - Date.now()) + '</b></p>' + actionButtons);
   return;
 }

 const vacEndMs = isVacationActive(name);
 if(vacEndMs){
   const vac = vacations[name];
   const startDateStr = vac && vac.activeStart ? new Date(vac.activeStart).toLocaleDateString('de-AT') : 'Unbekannt';
   const endDateStr = new Date(vacEndMs).toLocaleDateString('de-AT');
   const nextPlayableDate = new Date(vacEndMs + DAY);
   nextPlayableDate.setHours(0,0,0,0);
   const playableDateStr = nextPlayableDate.toLocaleDateString('de-AT');

   modal(`
     <h3>Spieler im Urlaub</h3>
     <p class="hint"><b>${escapeHtml(name)}</b> befindet sich aktuell im Urlaub.</p>
     <p class="hint"><b>Urlaubszeitraum:</b><br>${startDateStr} bis ${endDateStr}</p>
     <p class="hint"><b>Wieder fordern ab:</b><br>${playableDateStr}</p>
     <button class="btn" onclick="closeM()">Schließen</button>
   `);
   return;
 }

 if(selected === null){
  if(name === 'FREI'){ editPlayerDirect(p); return; }
  
  if(currentSession && currentSession.type === 'player'){
    const remaining = lockRemaining(name);
    if(remaining > 0){ alert(name+' darf erst in '+lockText(remaining)+' wieder selbst eine Forderung aussprechen.'); return; }
  }

  selected = p; render(); return;
 }

 if(selected === p){ selected = null; render(); return; }

 if(allowed(selected).includes(p)){
  const challenger = players[selected-1], opponent = players[p-1];
  
  if(activeFixedChallengeForName(opponent) || activeFixedChallengeForName(challenger)){
   alert('Einer der Spieler befindet sich bereits in einer aktiven Forderung.');
   selected = null; render(); return;
  }

  const pairWait = opponentRemaining(challenger, opponent);
  if(pairWait > 0){
   alert('Diese beiden Spieler dürfen erst in '+lockText(pairWait)+' wieder gegeneinander spielen.');
   selected = null; render(); return;
  }
  
  pending = {from: selected, to: p, challenger, opponent, fixedId: null};
  showChallengeChoice();
 } else { selected = null; render(); }
}

function showChallengeChoice(){
  modal('<h3>Forderung</h3><p class="hint">'+escapeHtml(pending.challenger)+' gegen '+escapeHtml(pending.opponent)+'</p><button class="btn" onclick="showResultEntry()">Ergebnis eingeben</button><button class="btn" onclick="fixChallenge()">Forderung fixieren</button><button class="btn" onclick="cancelResult()">Abbrechen</button>');
}

window.fixChallenge = function(){
  const now = Date.now();
  let durationMs = ruleChallengeDays * DAY;
  const ch = {
    id: Date.now() + Math.random(),
    challenger: pending.challenger,
    opponent: pending.opponent,
    from: pending.from,
    to: pending.to,
    createdAt: now,
    expiresAt: now + durationMs,
    status: 'fixed'
  };
  if(!Array.isArray(fixedChallenges)) fixedChallenges = [];
  fixedChallenges.push(ch);
  addHist('Forderung fixiert: '+ch.challenger+' gegen '+ch.opponent);
  
  const waText = encodeURIComponent(`Hallo ${ch.opponent}, du wurdest in der Solo-Pyramide von ${ch.challenger} gefordert! Bitte vereinbart einen Termin. (${window.location.href})`);
  
  modal(`
    <h3>Forderung erfolgreich fixiert!</h3>
    <p class="hint"><b>${escapeHtml(ch.challenger)}</b> fordert <b>${escapeHtml(ch.opponent)}</b>.</p>
    <a href="https://api.whatsapp.com/send?text=${waText}" target="_blank" style="text-decoration:none;"><button class="btn whatsappBtn" style="background:#25d366; color:#fff;">📱 Gegner jetzt per WhatsApp benachrichtigen</button></a>
    <button class="btn" onclick="pending = null; selected = null; window.save(); closeM(); render();">Fertig</button>
  `);
}

window.withdrawChallenge = function(idStr){
  const id = Number(idStr);
  if(!Array.isArray(fixedChallenges)) fixedChallenges = [];
  const ch = fixedChallenges.find(x => x && x.id === id);
  if(!ch) { closeM(); return; }

  const withdrawText = ruleWithdrawHours > 0 ? ` (inkl. ${ruleWithdrawHours}h Sperre für beide)` : '';
  if(!confirm('Möchtest du die Forderung zwischen ' + ch.challenger + ' und ' + ch.opponent + ' wirklich zurückziehen?' + withdrawText)) return;

  if(ruleWithdrawHours > 0){
    const lockDuration = ruleWithdrawHours * HOUR;
    challengerLocks[ch.challenger] = Date.now() + lockDuration;
    challengerLocks[ch.opponent] = Date.now() + lockDuration;
  }

  fixedChallenges = fixedChallenges.filter(x => x && x.id !== id);
  addHist('Forderung zurückgezogen: ' + ch.challenger + ' vs ' + ch.opponent + (ruleWithdrawHours > 0 ? ` (${ruleWithdrawHours}h Sperre)` : ''));
  pending = null; selected = null; window.save(); closeM(); render();
}

}

window.applyResult = function(){
 if(!pending) return;
 const challengerScore = Number(document.getElementById('scoreChallenger').value);
 const opponentScore = Number(document.getElementById('scoreOpponent').value);
 const valid = (challengerScore === 3 && opponentScore >= 0 && opponentScore <= 2) || (opponentScore === 3 && challengerScore >= 0 && challengerScore <= 2);
 if(!valid){ alert('Ungültiges Ergebnis.'); return; }
 
 const challenger = pending.challenger, opponent = pending.opponent;
 
 if(ruleLockHoursAfterGame > 0){
   challengerLocks[challenger] = Date.now() + (ruleLockHoursAfterGame * HOUR);
 }
 delete challengerLocks[opponent];
 opponentLocks[pairKey(challenger, opponent)] = Date.now() + 7 * DAY;
 
 if(Array.isArray(fixedChallenges)){
   fixedChallenges = fixedChallenges.filter(ch => !(ch && ch.status==='fixed' && pairKey(ch.challenger, ch.opponent) === pairKey(challenger, opponent)));
 }
 
 const from = players.indexOf(challenger) + 1;
 const to = players.indexOf(opponent) + 1;
 
 if(challengerScore === 3){
  players.splice(to - 1, 0, challenger);
  players.splice(from, 1);
  addHist(challenger+' besiegte '+opponent+' '+challengerScore+':'+opponentScore);
 } else {
  addHist(opponent+' besiegte '+challenger+' '+opponentScore+':'+challengerScore);
 }
 pending = null; selected = null; window.save(); closeM(); render();
}

function render(){
  try {
    cleanExpiredLocks();
    renderHeader();
    renderInfoBox();
    
    if(!pyramidEl) return;
    pyramidEl.innerHTML = '';
    
    let p = 1;
    for(let r=1; p <= currentMaxPlayers; r++){
      let row = document.createElement('div');
      row.className = 'row';
      for(let c=1; c<=r && p<=currentMaxPlayers; c++){
        let cp = p, d = document.createElement('div');
        d.className = 'card';
        const name = players[cp-1] || 'FREI';
        const fixed = activeFixedChallengeForName(name);
        const isAllowed = selected && allowed(selected).includes(cp);
        const remaining = lockRemaining(name);
        const vacUntil = isVacationActive(name);
        
        if(name === 'FREI') d.classList.add('free');
        if(name !== 'FREI' && vacUntil) d.classList.add('vacation');
        else if(name !== 'FREI' && remaining > 0) d.classList.add('locked');
        if(fixed) d.classList.add('challengeFixed');
        if(cp === selected) d.classList.add('selected');
        if(isAllowed) d.classList.add('allowed');
        
        let sub = '';
        if(vacUntil){
          sub = '<div class="vacationBadge">Urlaub</div>';
        } else if(fixed){
          const restMs = Math.max(0, fixed.expiresAt - Date.now());
          sub = '<div class="challengedBy">vs. '+escapeHtml(fixed.opponent===name?fixed.challenger:fixed.opponent)+'</div><div class="timeBadge">⏳ '+lockText(restMs)+'</div>';
        }else if(name !== 'FREI' && remaining > 0){
          sub = '<div class="lockBadge">🔒 '+lockText(remaining)+'</div>';
        }
        
        d.innerHTML = '<div class="place">Platz '+cp+'</div><div class="nameBox"><b>'+escapeHtml(name).replace(/ /g,'<br>')+'</b></div>'+sub;
        d.addEventListener('click', () => clickPlace(cp));
        d.addEventListener('dblclick', (e) => { 
          e.preventDefault(); e.stopPropagation(); 
          if(currentSession && (currentSession.type === 'admin' || currentSession.type === 'infosystem')){
            selected = null; editPlayerDirect(cp); 
          }
        });
        row.appendChild(d);
        p++;
      }
      pyramidEl.appendChild(row);
    }
  } catch(err) {
    console.error("Fehler im Render-Prozess: ", err);
  }
}
</script>
</body>
</html>
