<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECW · Aktivität Halle</title><style>
:root{color-scheme:dark;--bg:#101114;--panel:#222429;--line:#41434a;--red:#b51e2d;--green:#65db98;--yellow:#ffd16e;--muted:#aeb3bd}*{box-sizing:border-box}body{margin:0;background:repeating-linear-gradient(45deg,#17181c 0 3px,#131417 3px 6px);color:#f5f5f6;font:15px/1.45 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:18px 16px 34px}header{border:1px solid #f05a62;border-radius:14px;padding:19px;background:linear-gradient(150deg,#d12d3c,#74121c);box-shadow:0 5px 20px #0007}header small{letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:#ffd9dc}h1{margin:3px 0;font-size:clamp(25px,5vw,36px)}p{margin:8px 0}.notice{border:1px solid #ad873e;background:#302719;color:#ffe4a7;padding:10px 12px;border-radius:9px;margin:14px 0}nav,.segments{display:flex;gap:7px;flex-wrap:wrap}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #54565c;border-radius:8px;padding:10px 13px;background:#303239;color:white;font-weight:650}button[aria-selected=true],button.active{background:var(--red);border-color:#e35e69}nav button{flex:1}section{margin-top:18px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.kpi,.card{background:linear-gradient(145deg,#2a2b31,#1b1c20);border:1px solid var(--line);border-radius:12px;padding:13px}.kpi b{display:block;font-size:27px}.kpi span,.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card h2{font-size:18px;margin:0 0 10px}.device{display:flex;justify-content:space-between;gap:9px;align-items:center;border-top:1px solid #3d3f45;padding:9px 0}.device small{display:block;color:var(--muted)}.pill{font-size:13px;white-space:nowrap;font-weight:750}.on{color:var(--green)}.off{color:#ff888e}.partial{color:var(--yellow)}.unknown{color:#b8bdc6}details{border-top:1px solid var(--line);margin-top:6px;padding-top:8px}summary{cursor:pointer;color:#cdd0d8;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 5px;border-bottom:1px solid #41434a;vertical-align:top}th{color:#bcc0c8}td.num,th.num{text-align:right}.chartrow{margin:10px 0}.chartrow label{display:flex;justify-content:space-between;font-size:13px}.track{background:#34363c;border-radius:5px;height:7px;margin:3px 0 6px;overflow:hidden}.bar{height:100%;background:#e44b57}.bar.tv{background:#85aaf9}.legend{font-size:13px;color:#bbb}.config{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;min-width:0;background:#111217;color:#eee;border:1px solid #565860;padding:9px;border-radius:6px}label.field{display:block;color:#c2c4cc;font-size:12px;margin-top:8px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}h2{font-size:21px}h3{margin:12px 0 4px}footer{text-align:center;color:#aeb3bd;font-size:12px;margin-top:24px} .scroll{overflow:auto}@media(max-width:520px){main{padding:12px}.grid{grid-template-columns:1fr}.kpi{padding:8px}.kpi b{font-size:23px}nav button{font-size:13px;padding:9px 5px}.config{grid-template-columns:1fr}.card{padding:11px}}
.grid{grid-template-columns:minmax(0,1fr)}
</style></head><body><main><header><small>EC Wegscheid · Technik</small><h1>Aktivität Halle</h1><p>Live-Status und Betriebszeiten · Vorbereitung V0.1</p></header><div class="notice">TESTMODUS – sämtliche Schaltzustände und Betriebszeiten sind simuliert. Es werden keine realen Geräte abgefragt oder geschaltet.</div><nav><button data-tab="live" aria-selected="true">Live-Übersicht</button><button data-tab="usage" aria-selected="false">Betriebszeiten</button><button data-tab="admin" aria-selected="false">Geräteverwaltung</button></nav><section id="content"></section><footer>ECW Technik · Lokale Testversion · Kein produktiver Zugriff</footer></main><script>
'use strict';
const defs=[...Array.from({length:4},(_,i)=>({id:`licht${i+1}`,name:`Licht Bahn ${i+1}`,type:'licht',n:4,source:'Casambi'})),...Array.from({length:4},(_,i)=>({id:`stocktv${i+1}`,name:`StockTV ${i+1}`,type:'tv',n:1,source:'Raspberry'})),{id:'lichtGang',name:'Licht Gang',type:'licht',n:2,source:'Casambi (Zuordnung offen)'},{id:'whiteboard',name:'Whiteboard',type:'tv',n:1,source:'Samsung WM65B'}];
const key='ecw-activity-demo-v1',tz='Europe/Berlin';let tab='live',period='today',role='admin';const f=new Intl.DateTimeFormat('de-DE',{timeZone:tz,dateStyle:'medium',timeStyle:'short'}), dayFmt=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'});const fmt=t=>f.format(new Date(t));const localDay=t=>{const p=Object.fromEntries(dayFmt.formatToParts(new Date(t)).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`};
function midnight(ymd){const target=Date.parse(ymd+'T00:00:00Z');let t=target;for(let i=0;i<3;i++){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(t).map(x=>[x.type,x.value]));t+=target-Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);}return t;}
function startOf(p,now){let day=localDay(now),d=new Date(day+'T00:00:00Z');if(p==='week')d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);if(p==='month')d.setUTCDate(1);if(p==='year')d.setUTCMonth(0,1);return midnight(d.toISOString().slice(0,10));}
function aggregate(events,start,end){let last='unknown',cursor=start,on=0,unknown=0,count=0;const sorted=[...events].sort((a,b)=>a.t-b.t);const active=s=>s==='on'||s==='partial';for(const e of sorted){if(e.t<start){last=e.state;continue}if(e.t>=end)break;if(active(last))on+=e.t-cursor;if(last==='unknown')unknown+=e.t-cursor;if(last==='off'&&active(e.state))count++;cursor=e.t;last=e.state;}if(active(last))on+=end-cursor;if(last==='unknown')unknown+=end-cursor;return {on,unknown,count};}
const duration=ms=>`${Math.floor(ms/3600000).toString().padStart(2,'0')}:${Math.floor(ms/60000%60).toString().padStart(2,'0')} h`;
function makeDemo(){const now=Date.now(),start=startOf('year',now),today=startOf('today',now),states=['on','partial','off','on','on','off','off','on','on','unknown'];let events={},config={};defs.forEach((d,i)=>{events[d.id]=[{t:start,state:'off',lit:0}];for(let k=30;k>=1;k--){let t=midnight(new Date(Date.parse(localDay(now)+'T00:00:00Z')-k*86400000).toISOString().slice(0,10))+16*3600000;if(t>=start){events[d.id].push({t,state:'on',lit:d.n},{t:t+(1+(i+k)%5)*3600000,state:'off',lit:0})}}let state=states[i],t=today+Math.max(0,(now-today)*(.25+.05*(i%5)));events[d.id].push({t:Math.floor(t),state,lit:state==='on'?d.n:state==='partial'?2:state==='off'?0:null});config[d.id]={address:'',enabled:true,source:d.source};});return {events,config};}
let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}if(!data||!data.events||!data.config)data=makeDemo();const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch{}};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=id=>data.events[id].at(-1)||{state:'unknown',t:Date.now(),lit:null};const status=e=>({on:'● EIN',off:'● AUS',partial:'◐ TEIL',unknown:'● UNBEKANNT'}[e.state]);
function device(d){let e=current(d.id);return `<div class="device"><div><b>${d.type==='licht'?'💡':'▣'} ${d.type==='licht'?'Licht':d.name}</b><small>${e.state==='unknown'?'Keine Statusdaten':('Seit '+fmt(e.t))}</small></div><span class="pill ${e.state}">${status(e)}${d.n>1&&e.lit!==null?' · '+e.lit+'/'+d.n:''}</span></div>`}
function card(title,items){return `<article class="card"><h2>${title}</h2>${items.map(device).join('')}<details><summary>Details anzeigen</summary>${items.map(d=>`<p>${d.name}: <b>${duration(aggregate(data.events[d.id],startOf('today',Date.now()),Date.now()).on)}</b> heute</p>`).join('')}</details></article>`}
const temperatureDemo=[{name:'Außen',c:8.44,rh:99.9},{name:'Halle',c:12.94,rh:64},{name:'Vereinsheim',c:18.62,rh:44.7}];
const decimal=new Intl.NumberFormat('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
function temperatures(){return `<article class="card"><h2>Temperaturen</h2>${temperatureDemo.map(m=>`<div class="device"><div><b>🌡 ${m.name}</b><small>💧 ${decimal.format(m.rh)} % Luftfeuchtigkeit</small></div><span class="pill" style="font-size:20px;color:#85aaf9">${decimal.format(m.c)} °C</span></div>`).join('')}<p class="muted">ThermoBeacon · Beispielmesswerte · ECWDRUCKSERVER</p></article>`}
function printJobs(){const now=Date.now(),start=startOf('today',now),jobs=[{name:'Turniereinladung.pdf',pages:2,t:start+(now-start)*.8},{name:'Startliste.pdf',pages:1,t:start+(now-start)*.5},{name:'Ergebnisliste.pdf',pages:3,t:start+(now-start)*.2}];return `<article class="card"><h2>Getätigte Druckaufträge</h2><div class="summary" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi"><b class="on">${jobs.length}</b><span>Abgeschlossen heute</span></div><div class="kpi"><b>${jobs.reduce((sum,j)=>sum+j.pages,0)}</b><span>Seiten heute</span></div></div>${jobs.map(j=>`<div class="device"><div><b>🖨 ${esc(j.name)}</b><small>${fmt(j.t)} · ${j.pages} ${j.pages===1?'Seite':'Seiten'}</small></div><span class="pill on">✓ Gedruckt</span></div>`).join('')}<p class="muted">HP Color Laser MFP · CUPS / ECWDRUCKSERVER · Testdaten</p></article>`}
function getHallenstatus(){const bahnen=[1,2,3,4].map(n=>({bahn:n,zustand:current('licht'+n).state})),beleuchteteBahnen=bahnen.filter(b=>b.zustand==='on'||b.zustand==='partial').map(b=>b.bahn),geoeffnet=beleuchteteBahnen.length>0?true:bahnen.every(b=>b.zustand==='off')?false:null;return {geoeffnet,status:geoeffnet===true?'geoeffnet':geoeffnet===false?'geschlossen':'unbekannt',text:geoeffnet===true?'Halle geöffnet':geoeffnet===false?'Halle geschlossen':'Hallenstatus unbekannt',beleuchteteBahnen,quelle:'Bahnbeleuchtung',demo:true};}
function hallenstatusCard(){const s=getHallenstatus(),cls=s.geoeffnet===true?'on':s.geoeffnet===false?'off':'unknown';return `<article class="card" style="margin-bottom:12px;border-color:currentColor" aria-live="polite"><div class="section-head"><div><small class="muted">Smartphone · Halle</small><h2 class="${cls}" style="margin:4px 0">● ${s.text}</h2></div><span class="pill ${cls}">${s.beleuchteteBahnen.length}/4 Bahnen beleuchtet</span></div><p class="muted">${s.beleuchteteBahnen.length?'Licht an: Bahn '+s.beleuchteteBahnen.join(', '):s.geoeffnet===false?'Alle vier Bahnbeleuchtungen aus.':'Mindestens ein Lichtstatus fehlt.'}</p><details><summary>Ausgabe für Smartphone (Demo)</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(s,null,2))}</pre></details></article>`;}
function live(){let states=defs.map(d=>current(d.id).state);return `<div class="section-head"><h2>Aktueller Status</h2><span class="muted">Demo</span></div>${hallenstatusCard()}<div class="summary"><div class="kpi"><b class="on">${states.filter(s=>s==='on'||s==='partial').length}</b><span>Aktiv</span></div><div class="kpi"><b class="off">${states.filter(s=>s==='off').length}</b><span>Aus</span></div><div class="kpi"><b class="unknown">${states.filter(s=>s==='unknown').length}</b><span>Unbekannt</span></div></div><div class="grid">${[1,2,3,4].map(i=>card('Bahn '+i,[defs.find(d=>d.id==='licht'+i),defs.find(d=>d.id==='stocktv'+i)])).join('')}${card('Gang',[defs.find(d=>d.id==='lichtGang')])}${card('Informationssystem',[defs.find(d=>d.id==='whiteboard')])}${temperatures()}${printJobs()}</div>`}
function usage(){let now=Date.now(),start=startOf(period,now),values=defs.map(d=>({...d,...aggregate(data.events[d.id],start,now)})),max=Math.max(1,...values.map(d=>d.on));return `<h2>Betriebszeiten</h2><div class="segments">${Object.entries({today:'Heute',week:'Woche',month:'Monat',year:'Jahr'}).map(([k,v])=>`<button data-period="${k}" class="${period===k?'active':''}">${v}</button>`).join('')}</div><p class="muted">${fmt(start)} – ${fmt(now)} · Berlin · Testdaten</p><div class="card scroll"><table><thead><tr><th>Funktion</th><th class="num">Betrieb</th><th class="num">Starts</th><th class="num">Unbekannt</th></tr></thead><tbody>${values.map(d=>`<tr><td>${d.name}</td><td class="num">${duration(d.on)}</td><td class="num">${d.count}</td><td class="num">${duration(d.unknown)}</td></tr>`).join('')}</tbody></table></div><h3>Betriebsdauer im Vergleich</h3><div class="card"><p class="legend"><span style="color:#e44b57">● Licht</span> &nbsp; <span style="color:#85aaf9">● StockTV / Whiteboard</span></p>${values.map(d=>`<div class="chartrow"><label>${d.name}<b>${duration(d.on)}</b></label><div class="track"><div class="bar ${d.type==='tv'?'tv':''}" style="width:${100*d.on/max}%"></div></div></div>`).join('')}</div>`}
function admin(){return `<h2>Geräteverwaltung</h2><p class="muted">Admin-Ansicht der Demo – noch keine echte Rechteprüfung. Eingaben und Simulation bleiben lokal.</p><div class="card"><b>ECWDRUCKSERVER</b><p>IP-Adresse lokal zu erfassen · Raspberry Pi 3B</p><p class="muted">Casambi Evolution · passwortgeschützt · 18 Geräte · Gateway dauerhaft offen</p></div><div class="config">${defs.map(d=>{const c=data.config[d.id];return `<article class="card"><b>${d.name}</b><p class="muted">${esc(d.source)}</p><label class="field">IP-Adresse / Leuchten-ID(s)<input data-address="${d.id}" value="${esc(c.address)}" placeholder="Noch zu erfassen"></label><label class="field">Überwachung<select data-enabled="${d.id}"><option value="true" ${c.enabled?'selected':''}>Aktiv</option><option value="false" ${!c.enabled?'selected':''}>Deaktiviert</option></select></label><label class="field">Testzustand<select data-state="${d.id}">${['on','off',...(d.n>1?['partial']:[]),'unknown'].map(s=>`<option value="${s}" ${current(d.id).state===s?'selected':''}>${status({state:s})}</option>`).join('')}</select></label></article>`}).join('')}</div><div class="actions"><button id="export">Gerätekonfiguration exportieren</button><button id="reset">Neue Testdaten</button></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));document.getElementById('content').innerHTML=tab==='live'?live():tab==='usage'?usage():admin();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.period){period=b.dataset.period;render()}if(b.id==='reset'&&confirm('Lokale Testdaten zurücksetzen? Geräteeinstellungen bleiben erhalten.')){const config=data.config;data=makeDemo();data.config=config;save();render()}if(b.id==='export'){const blob=new Blob([JSON.stringify({mode:'configuration-only',server:'ECWDRUCKSERVER',devices:data.config},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ecw-aktivitaet-konfiguration.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});
document.addEventListener('change',e=>{const el=e.target,id=el.dataset.state||el.dataset.address||el.dataset.enabled;if(!id)return;if(el.dataset.address)data.config[id].address=el.value.trim();if(el.dataset.enabled)data.config[id].enabled=el.value==='true';if(el.dataset.state){const d=defs.find(d=>d.id===id),s=el.value;if(current(id).state!==s)data.events[id].push({t:Date.now(),state:s,lit:s==='on'?d.n:s==='partial'?Math.max(1,d.n-1):s==='off'?0:null})}save()});if(new URLSearchParams(location.search).get('ansicht')==='1')document.querySelector('[data-tab="admin"]').remove();render();
</script></body></html>
