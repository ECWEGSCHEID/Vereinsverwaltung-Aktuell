<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#380507">
<title>EC Wegscheid · Mitgliederbereich</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;color:#fff;font:16px system-ui,sans-serif;background:radial-gradient(ellipse at top,#4b171b,transparent 57%),repeating-linear-gradient(135deg,#151517 0 3px,#19191c 3px 6px)}
main{max-width:490px;margin:auto;padding:clamp(28px,8vh,80px) 20px 40px}
header{display:flex;align-items:center;gap:14px;margin-bottom:38px}
header strong{font-size:21px}
header small{display:block;color:#e4bec1;margin-top:3px}
section{background:#202023;border:1px solid #454045;border-radius:20px;padding:clamp(18px,5vw,28px);box-shadow:0 18px 50px #0005}
h1{font-size:clamp(24px,6vw,32px);margin:0 0 20px;line-height:1.15}
label{display:block;margin-bottom:8px;font-weight:650}
input,select,button{font:inherit;border-radius:10px;min-height:48px;width:100%}
input,select{background:#151517;border:1px solid #77717a;padding:12px;color:white}
button{cursor:pointer;color:white;background:#b91f2e;border:1px solid transparent;padding:12px;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffb9bf;outline-offset:3px}
form button,.password-label{margin-top:14px}
p{line-height:1.5;color:#ddd5d8}
.hint{font-size:14px;margin:14px 0 0}
#error{color:#ffb9bf}
nav{display:grid;gap:10px}
nav button,.reservation-link{display:flex;justify-content:space-between;align-items:center;background:#2c292d;border-color:#4c4248;text-align:left;min-height:58px;padding-inline:16px}
.reservation-link{border:1px solid #4c4248;border-radius:10px;color:white;font-weight:700;text-decoration:none}
.reservation-link:focus-visible{outline:3px solid #ffb9bf;outline-offset:3px}
nav button:hover,.reservation-link:hover{background:#42282e}
.arrow{color:#ffaeb6;font-size:24px;line-height:1}
.hall-status{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid #665047;border-radius:10px;background:#302725}
.hall-status strong{color:#ffd2a9}
.temperature-title{font-size:18px;margin:20px 0 8px}
.readings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0}
.readings div{background:#2c292d;border:1px solid #4c4248;border-radius:10px;padding:10px 5px;text-align:center}
.readings dt{font-size:clamp(11px,3vw,14px);color:#e9d7db}
.readings dd{margin:6px 0 0;font-size:clamp(14px,4vw,20px);font-weight:750;white-space:nowrap}
main:has(#detail:not([hidden]) > #hall-panel:not([hidden])){
  padding:8px 10px 10px;
}
main:has(#detail:not([hidden]) > #hall-panel:not([hidden])) header{
  margin-bottom:8px;
}
#detail:has(> #hall-panel:not([hidden])){
  padding:10px;
}
#detail:has(> #hall-panel:not([hidden])) > h1{
  margin:0 0 8px;
  font-size:clamp(20px,5vw,26px);
}
#hall-panel .hall-status{padding:6px 9px}
#hall-panel .temperature-title{margin:8px 0 5px;font-size:16px}
#hall-panel .readings{gap:4px}
#hall-panel .readings div{padding:5px 3px}
#hall-panel .readings dd{margin-top:3px}
#hall-panel .readings .hall-humidity{
  font-size:clamp(10px,3vw,13px);
  font-weight:500;
  white-space:normal;
}
#hall-panel > p{margin:6px 0 0}
#hall-panel #ecwMemberTemperatureDetailsButton{min-height:40px;padding:6px 8px}
@media (max-height:420px){
  main:has(#detail:not([hidden]) > #hall-panel:not([hidden])) header{display:none}
}
#detail{margin-bottom:calc(74px + env(safe-area-inset-bottom, 0px))}
.detail-nav{position:fixed;inset:auto 0 0;z-index:4;display:flex;justify-content:center;padding:8px max(12px,env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px,env(safe-area-inset-left, 0px));background:#202023;border-top:1px solid #51434b}
#back{min-height:54px;max-width:450px;margin:0;background:#b91f2e;border-color:transparent}
#module{position:fixed;inset:0 0 auto;height:100vh;height:100dvh;z-index:5;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:0;border:0;border-radius:0;background:#151517}
#module.has-result-options{grid-template-rows:auto minmax(0,1fr) auto;bottom:auto;height:100vh;height:100dvh}
#result-options{background:#202023}
#result-options .result-selector{padding:3px 6px 6px}
#result-options select{min-height:38px;padding:5px 8px}
#module-results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:max(6px,env(safe-area-inset-top)) 6px 6px;background:#202023;border-bottom:1px solid #51434b}
#module-results button{min-width:0;min-height:42px;padding:4px;font-size:clamp(11px,3.2vw,14px);line-height:1.15;overflow-wrap:anywhere}
#module-results button[aria-pressed="true"]{background:#752231;border-color:#db727b;color:#fff}
#module iframe{width:100%;height:100%;min-height:0;border:0;background:#202023}
.module-nav{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 12px max(8px,env(safe-area-inset-bottom));background:#202023;border-top:1px solid #51434b}
.module-nav button{min-height:52px}
#module.is-results .module-nav{grid-template-columns:minmax(0,1fr)}
#result-reader{width:100%;max-width:760px;justify-self:center;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;touch-action:pan-y pinch-zoom;padding:12px max(8px,env(safe-area-inset-right,0px)) 16px max(8px,env(safe-area-inset-left,0px))}
#result-reader h1{font-size:clamp(18px,5vw,26px);margin:0 0 12px}
#result-reader table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:clamp(11px,3.1vw,15px)}
#result-reader th,#result-reader td{padding:6px 2px;border-bottom:1px solid #4c4248;text-align:center;overflow-wrap:anywhere;vertical-align:top}
#result-reader th{background:#63202a}
#result-reader #result-table section{padding:8px;border-radius:8px;margin-top:8px}
#result-reader #result-table h2{margin:0 0 6px;font-size:16px}
#result-reader :is(th,td):nth-child(2){width:32%;text-align:left}
#result-reader :is(th,td):first-child{width:9%}
#result-reader :is(th,td):nth-child(2){padding-left:4px}
.module-nav a{display:grid;place-items:center;color:#fff;padding-inline:10px;font-size:14px}
#results button{text-align:left}
#latest-wrap{margin-top:22px;padding-top:16px;border-top:1px solid #4c4248}
#latest-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;background:#2c292d;border:1px solid #6a5a60;border-radius:12px;min-height:52px;font-size:16px}
#latest-toggle span{transition:transform .2s}
#latest-toggle[aria-expanded="true"] span{transform:rotate(180deg)}
#latest-results{margin-top:10px}
.latest-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.latest-list li{background:#2c292d;border:1px solid #4c4248;border-left:5px solid #888;border-radius:10px;padding:7px 9px}
.latest-list li.latest-duoCup{border-left-color:#2e86de}
.latest-list li.latest-frauencup{border-left-color:#e84393}
.latest-list li.latest-jahresmeisterschaft{border-left-color:#f0b400}
.latest-top{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#e9d7db;flex-wrap:wrap}
.latest-main{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-top:2px}
.latest-main strong{white-space:nowrap}
.latest-detail{font-size:12px;color:#cfc3c7}
#planner-list{display:grid;gap:8px}
#myresults-content{display:grid;gap:6px;margin-top:8px}
.my-row-highlight{border-color:#2e9e5a!important;box-shadow:inset 3px 0 0 #2e9e5a}
.solo-inactive{display:none!important}
.ov-card{background:#2c292d;border:1px solid #4c4248;border-radius:12px;padding:10px 8px;margin:0 0 12px}
.ov-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ov-hi{font-size:19px;font-weight:bold;margin:0}
.ov-label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.3px;color:#e9d7db;margin:12px 0 5px}
.ov-box{background:#3a2f33;border-radius:8px;padding:6px 8px;margin-bottom:5px;overflow-wrap:anywhere}
.ov-title{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:bold}
.ov-sub{font-size:13px;color:#e9d7db;margin-top:2px}
.ov-date{font-size:13px;color:#ffd7dc;font-weight:bold}
.ov-mode{flex:0 0 auto;align-self:center;font-size:11px;background:#8a1f2b;color:#fff;border-radius:6px;padding:2px 7px;white-space:nowrap}
.ov-mode-frauen{background:#7a2f6a}.ov-mode-solo{background:#2f5a7a}
.ov-warn{background:#4a3410;border:1px solid #8a6420}.ov-warn .ov-title{color:#ffd98a}
.ov-calendar{display:block;width:100%;margin:8px 0 2px}
/* Mein Überblick: Kopfzeile (Vereinsname, Zurück, Abmelden) ausblenden – Zurück steht fest unten. */
main:has(#overview:not([hidden])) > header{display:none}
/* Mein Überblick: volle Bildschirmbreite nutzen, weniger Rand oben und seitlich. */
main:has(#overview:not([hidden])){max-width:none;padding:10px 6px 0}
main:has(#overview:not([hidden])) #detail-title{margin:0 0 8px 4px;font-size:22px}
main:has(#overview:not([hidden])) #detail{padding:10px 6px;border-radius:14px;box-sizing:border-box;min-height:calc(100svh - 20px - 74px - env(safe-area-inset-bottom, 0px))}
#detail .ov-card{background:none;border:0;border-radius:0;padding:0 2px;box-shadow:none}
#overview .ov-calendar{min-height:38px;padding:6px 10px;font-size:14px;margin:6px 0 0}
#overview .ov-hi{font-size:17px}
.ov-label{margin:10px 0 4px}
.ov-joined-label{font-size:12px}
.ov-chips{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 5px}
.ov-chip{font-size:11px;font-weight:bold;line-height:1.3;color:#fff;border-radius:6px;padding:2px 6px;background:#5a4a50}
.ov-chip-duoCup{background:#8a1f2b}.ov-chip-frauencup{background:#7a2f6a}.ov-chip-soloPyramide{background:#2f5a7a}
.ov-chip-montagsSolo{background:#2f6a5a}.ov-chip-jahresmeisterschaft{background:#7a5a1f}
.ov-joined-label{font-size:13px;color:#bfe8bf;font-weight:bold}
.ov-motivation{background:#24361f;border:1px solid #3d6b3d;color:#dff3d8;font-size:14px}
.my-row,.my-participations>summary{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#2c292d;border:1px solid #4c4248;border-radius:10px}
.my-participations>summary{cursor:pointer;list-style:none}
.my-participations>summary::-webkit-details-marker{display:none}
.my-participations[open]>summary{border-radius:10px 10px 0 0}
.my-row-text{display:grid;flex:1;min-width:0}
.my-row-text strong{font-size:15px;overflow-wrap:anywhere}
.my-row-detail{font-size:12px;color:#e9d7db}
.my-row-place{font-size:17px;font-weight:bold;white-space:nowrap;color:#ffd7dc}
.my-list{list-style:none;margin:0;padding:4px 10px 8px;background:#2c292d;border:1px solid #4c4248;border-top:0;border-radius:0 0 10px 10px;display:grid;gap:5px}
.my-list li{display:grid;grid-template-columns:78px 1fr;gap:6px;font-size:13px}
.my-list time{color:#e9d7db}
.my-rank-list li{grid-template-columns:1fr auto}
#myresults-picker{display:grid;gap:8px;margin-top:10px}
.planner-event{padding:10px 12px;background:#2c292d;border:1px solid #4c4248;border-radius:10px;overflow-wrap:anywhere}
.planner-event h2{font-size:16px;margin:3px 0 7px}
.planner-event time,.planner-event dt{color:#e9d7db;font-size:12px}
.planner-event dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 10px;margin:0}
.planner-event dd{margin:0;font-size:14px}
body:has(#login:not([hidden]), #menu:not([hidden]), #session-check:not([hidden])){
  background:#5b0000 linear-gradient(180deg,#1b0306b0,#28040740 45%,#21030588);
  background-image:linear-gradient(180deg,#1b0306b0,#28040740 45%,#21030588),url("assets/smartphone-carbon-startseite.webp");
  background-position:center;
  background-size:cover;
  background-attachment:fixed;
}
main:has(#login:not([hidden]), #menu:not([hidden]), #session-check:not([hidden])){
  padding:8px 10px 28px;
}
main:has(#login:not([hidden]), #menu:not([hidden]), #session-check:not([hidden])) header{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin:0 0 8px;
  padding:7px 8px;
  border:1px solid #af5054;
  border-radius:10px;
  background:linear-gradient(110deg,#1b1216,#351416);
  box-shadow:0 3px 12px #1d00066b;
}
.portal-name strong{display:block;font-size:clamp(16px,4.7vw,21px);line-height:1.15}
.portal-name small{font-size:clamp(12px,3.2vw,14px);line-height:1.2;margin-top:2px}
.account-actions{display:none;gap:4px;flex-shrink:0}
main:has(#menu:not([hidden])) .account-actions{display:flex}
.account-actions button{
  width:auto;
  min-height:44px;
  padding:4px clamp(7px,2vw,11px);
  border:1px solid #a76a70;
  background:#2b2125;
  font-size:clamp(12px,3.2vw,14px);
  line-height:1.15;
}
.account-actions #logout{background:#711a23}
.account-actions button:hover{background:#8c2530}
#login{padding:clamp(12px,4vw,20px);border-color:#96505a;background:#241c21f5}
#login h1{margin-bottom:12px}
main:has(#menu:not([hidden])){
  display:flex;
  flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
}
#menu{
  display:flex;
  flex:1;
  background:transparent;
  border:0;
  border-radius:0;
  box-shadow:none;
  padding:0;
}
#menu-title{position:absolute;margin:0;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#menu nav{
  flex:1;
  grid-template-columns:minmax(0,1fr);
  grid-auto-rows:minmax(min-content,1fr);
  gap:6px;
}
#menu nav button{
  gap:4px;
  min-width:0;
  min-height:46px;
  padding:5px clamp(12px,3vw,20px);
  border-color:#d56865;
  border-radius:9px;
  background:linear-gradient(160deg,#922329,#641217 72%,#4d0b12);
  box-shadow:inset 0 1px #ff9e8f55,0 3px 5px #2b0309a6;
  font-size:clamp(15px,4.2vw,18px);
  line-height:1.2;
  overflow-wrap:anywhere;
}
#menu nav button:hover{background:linear-gradient(160deg,#a82932,#721620)}
#menu .arrow{flex:none;font-size:19px}
@media (min-width:600px){
  main:has(#menu:not([hidden])){max-width:760px}
}
@media (max-height:430px){
  #menu nav{gap:4px}
  #menu nav button{min-height:0;padding-block:2px;font-size:clamp(13px,3.5vw,16px)}
  #menu .arrow{font-size:15px}
}
@media (max-height:320px){
  #menu nav{gap:2px}
}
#invitation-panel nav{gap:6px}
#invitation-panel nav button{min-height:48px}
.invitation-document{display:block;width:100%;height:auto;border-radius:6px;background:white}
#invitation-prev{margin:0 0 10px;background:#302529;border-color:#6f626b}
[hidden]{display:none!important}
</style>
<script src="ecw-site-base.js?v=3.1.90.261126"></script>
<script src="ecw-cup-results.js?v=20261121-meine"></script>
<script src="js/ecw-meine-ergebnisse.js?v=12-meisterschaft"></script>
<script src="js/ecw-mein-ueberblick.js?v=8"></script>
<script src="js/ecw-letzte-ergebnisse.js?v=2"></script>
<link rel="stylesheet" href="css/cup-team-results.css?v=3.1.36.181126">
</head>
<body>
<main>
<header>
<div class="portal-name"><strong>EC Wegscheid</strong><small>Mitgliederbereich</small></div>
<div class="account-actions" aria-label="Sitzung" role="group">
<button type="button" id="exit-member">Beenden</button>
<button type="button" id="logout">Abmelden</button>
</div>
</header>
<p id="session-check" class="hint" role="status">Anmeldung wird geprüft …</p>
<section id="login" aria-labelledby="login-title" hidden>
<h1 id="login-title">Anmelden</h1>
<form id="form">
<div id="member-login" hidden>
<label for="member-name">Mitglied auswählen</label>
<select id="member-name" autocomplete="username" disabled>
<option value="">Bitte Namen auswählen</option>
</select>
</div>
<div id="email-login">
<label for="email">E-Mail</label>
<input id="email" type="email" autocomplete="username" required>
</div>
<label class="password-label" for="password">Passwort</label>
<input id="password" type="password" autocomplete="current-password" aria-describedby="error" required>
<div id="activation-entry" hidden>
<label for="activation-value">Persönlicher Aktivierungscode oder Link</label>
<input id="activation-value" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
</div>
<p class="hint" id="activation-hint" hidden>Wähle deinen Namen und gib das Startpasswort ein.</p>
<div id="new-password-fields" hidden>
<label for="new-password">Neues Passwort</label>
<input id="new-password" type="password" autocomplete="new-password" minlength="6" disabled>
<label class="password-label" for="repeat-password">Neues Passwort wiederholen</label>
<input id="repeat-password" type="password" autocomplete="new-password" minlength="6" disabled>
</div>
<button>Anmelden</button>
<p class="hint" id="error" role="alert" hidden></p>
</form>
</section>
<section id="menu" aria-labelledby="menu-title" hidden>
<h1 id="menu-title" tabindex="-1">Hauptmenü</h1>
<nav aria-label="Hauptmenü">
<button type="button" data-mobile-feature="overview">Mein Überblick<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="reservation">Reservierungssystem<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="invitations">Turniereinladungen<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="planner">Terminplaner<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="hall">Halle<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="games">Spiele<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="tables">Tabellen<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="myresults">Meine Ergebnisse<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="solo">Solo Pyramide<span class="arrow" aria-hidden="true">›</span></button>
</nav>
</section>
<section id="detail" aria-labelledby="detail-title" hidden>
<h1 id="detail-title" tabindex="-1"></h1>
<nav id="results" aria-label="Tabellen" hidden>
<button type="button" data-result="cup" data-cup="duo">Duo Cup</button>
<button type="button" data-result="cup" data-cup="frauen">Frauencup</button>
<button type="button" data-result="jahresmeisterschaft">Ziel Jahresmeisterschaft</button>
</nav>
<div id="latest-wrap" hidden>
<button type="button" id="latest-toggle" aria-expanded="false" aria-controls="latest-results">Letzte Ergebnisse<span aria-hidden="true">▾</span></button>
<section id="latest-results" aria-live="polite" hidden></section>
</div>
<div id="invitation-panel" hidden>
<button type="button" id="invitation-prev" hidden></button>
<p id="invitation-status" class="hint" role="status"></p>
<div id="invitation-content"></div>
</div>
<div id="planner-panel" hidden>
<p id="planner-status" class="hint" role="status"></p>
<div id="planner-list"></div>
</div>
<section id="overview" class="ov-card" aria-label="Mein Überblick" hidden></section>
<div id="myresults-panel" hidden>
<p id="myresults-status" class="hint" role="status"></p>
<div id="myresults-picker" hidden></div>
<div id="myresults-content"></div>
</div>
<div id="hall-panel" hidden>
<div class="hall-status"><span>Hallenstatus</span><strong>Unbekannt</strong></div>
<h2 class="temperature-title">Temperaturanzeige</h2>
<dl class="readings">
<div><dt>Außen</dt><dd id="aussen">–</dd><dd class="hall-humidity">Luftfeuchtigkeit: <span id="aussen-humidity">–</span></dd></div>
<div><dt>Halle</dt><dd id="halle">–</dd><dd class="hall-humidity">Luftfeuchtigkeit: <span id="halle-humidity">–</span></dd></div>
<div><dt>Vereinsheim</dt><dd id="vereinsheim">–</dd><dd class="hall-humidity">Luftfeuchtigkeit: <span id="vereinsheim-humidity">–</span></dd></div>
</dl>
<p class="hint" id="temperature-status" role="status"></p>
<p><button type="button" id="ecwMemberTemperatureDetailsButton" aria-controls="ecwMemberTemperatureDetailsPanel" aria-expanded="false">Messwerte im Detail anzeigen</button></p>
<div id="ecwMemberTemperatureDetailsPanel" hidden role="region" aria-label="Temperaturdetails"></div>
</div>
<div class="detail-nav"><button type="button" id="back">← Zurück zum Startmenü</button></div>
</section>
<section id="module" aria-label="Vereinsmodul" hidden>

function plannerDate(value) {
  const raw = String(value || '').trim();
  const iso = raw.match(/^\d{4}-\d{2}-\d{2}/);
  if (iso) return iso[0];
  const parts = raw.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
  return parts ? parts[3] + '-' + parts[2].padStart(2, '0') + '-' + parts[1].padStart(2, '0') : '';
}

function upcomingEvents(events, now = new Date()) {
  const parts = Object.fromEntries(plannerClock.formatToParts(now).map(({type, value}) => [type, value]));
  const today = parts.year + '-' + parts.month + '-' + parts.day;
  const currentTime = parts.hour + ':' + parts.minute;
  return events.map(event => {
    const time = String(event.time || '').trim().match(/^([01]?\d|2[0-3]):([0-5]\d)(?::[0-5]\d)?$/);
    return {
      ...event,
      date: plannerDate(event.date),
      time: time ? time[1].padStart(2, '0') + ':' + time[2] : ''
    };
  }).filter(event => event.date > today || (event.date === today && event.time > currentTime))
    .sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time) ||
      String(a.name || '').localeCompare(String(b.name || ''), 'de'));
}

function plannerEventCard(event) {
  const card = document.createElement('article');
  card.className = 'planner-event';
  const date = document.createElement('time');
  date.dateTime = event.date;
  date.textContent = event.date.split('-').reverse().join('.') + (event.time ? ' · ' + event.time + ' Uhr' : '');
  const title = document.createElement('h2');
  title.textContent = event.name || 'Termin ohne Bezeichnung';
  const fields = document.createElement('dl');
  const values = [['Ort', event.location]];
  const type = String(event.type || '').trim().toLowerCase();
  if (type === 'turnier' || type === 'meisterschaft') {
    values.push(['Gemeldet von', event.reportedBy]);
    for (let index = 0; index < 4; index++) {
      values.push(['Spieler ' + (index + 1), event.players?.[index]]);
    }
  }
  for (const [label, value] of values) {
    const row = document.createElement('div');
    const term = document.createElement('dt');
    const description = document.createElement('dd');
    term.textContent = label;
    description.textContent = String(value || '').trim() || '–';
    row.append(term, description);
    fields.append(row);
  }
  card.append(date, title, fields);
  return card;
}

function invitationImageSource(value) {
  if (typeof value !== 'string') return '';
  if (/^data:image\/(?:avif|bmp|gif|jpe?g|png|webp);base64,/i.test(value)) return value;
  try {
    const image = new URL(value);
    return image.protocol === 'https:' && !image.username && !image.password ? image.href : '';
  } catch {
    return '';
  }
}

function invitationMonths(items, now = new Date()) {
  const today = new Intl.DateTimeFormat('sv-SE', {timeZone:'Europe/Berlin'}).format(now);
  const [year, month] = today.split('-').map(Number);
  const labels = new Intl.DateTimeFormat('de-DE', {month:'long',year:'numeric',timeZone:'UTC'});
  const months = Array.from({length:12}, (_,offset) => {
    const start = new Date(Date.UTC(year, month - 1 + offset, 1));
    return {key:start.toISOString().slice(0, 7), label:labels.format(start), items:[]};
  });
  const byKey = new Map(months.map(group => [group.key, group.items]));

  for (const item of items) {
    const list = byKey.get(item.month);
    if (!list || (item.endDate && item.endDate < today)) continue;
    const image = invitationImageSource(item.data);
    if (image) list.push({
      title: String(item.name || 'Einladung'),
      image,
      index: Number.isFinite(item.index) ? item.index : 0
    });
  }
  for (const group of months) group.items.sort((a,b) => a.index - b.index);
  return months;
}

function invitationButtons(entries, label, name, open) {
  const nav = document.createElement('nav');
  nav.setAttribute('aria-label', label);
  for (const entry of entries) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = name(entry);
    button.addEventListener('click', () => open(entry));
    nav.append(button);
  }
  invitationContent.replaceChildren(nav);
}

function renderInvitationMonths(months) {
  function showMonths() {
    invitationPrev.hidden = true;
    invitationPrev.onclick = null;
    invitationStatus.textContent = '';
    invitationButtons(months, 'Monat wählen', group =>
      group.label + ' · ' + group.items.length +
      (group.items.length === 1 ? ' Einladung' : ' Einladungen'), showMonth);
  }
  function showMonth(group) {
    invitationPrev.hidden = false;
    invitationPrev.textContent = '← Monatsübersicht';
    invitationPrev.onclick = () => {
      showMonths();
      invitationContent.querySelector('button')?.focus();
    };
    invitationStatus.textContent = group.items.length ? group.label : 'Keine Einladungen im ' + group.label + '.';
    invitationButtons(group.items, 'Einladungen im ' + group.label, item => item.title, item => showImage(group, item));
    invitationPrev.focus();
  }
  function showImage(group, item) {
    invitationPrev.textContent = '← Einladungen im ' + group.label;
    invitationPrev.onclick = () => showMonth(group);
    invitationStatus.textContent = item.title;
    const image = document.createElement('img');
    image.className = 'invitation-document';
    image.src = item.image;
    image.alt = item.title;
    invitationContent.replaceChildren(image);
    invitationPrev.focus();
  }
  showMonths();
}

async function ownMemberName() {
  const user = auth.currentUser;
  const alias = String(user?.email || '').toLowerCase().match(/^([a-f0-9]{32})@login\.ec-wegscheid\.de$/)?.[1]
    || String(user?.uid || '').match(/^ecw-mobile-([a-f0-9]{32})$/)?.[1];
  let directory = null;
  try { directory = await readMemberDirectory(); } catch { directory = null; }
  if (alias && directory) {
    for (const [name, entry] of directory) if (entry === alias) return {name, fixed: true, directory};
  }
  let stored = '';
  try { stored = localStorage.getItem(myResultsNameKey) || ''; } catch {}
  if (stored && (!directory?.size || directory.has(stored))) return {name: stored, fixed: false, directory};
  return {name: '', fixed: false, directory};
}

function showMyResultsPicker(directory, current, signal) {
  myResultsPicker.replaceChildren();

  select.add(new Option('Namen wählen …', ''));
  for (const name of [...directory.keys()].sort((a, b) => a.localeCompare(b, 'de'))) select.add(new Option(name, name));
  select.value = current || '';
  label.append(select);
  myResultsPicker.append(label);
  myResultsPicker.hidden = false;

    if (!select.value || signal.aborted) return;
    try { localStorage.setItem(myResultsNameKey, select.value); } catch {}

}

async function loadMyResults(signal) {
  myResultsContent.replaceChildren();

  myResultsPicker.hidden = true;
  myResultsStatus.textContent = 'Ergebnisse werden geladen …';
  try {
    const own = await ownMemberName();
    if (signal.aborted) return;
    if (!own.fixed) showMyResultsPicker(own.directory, own.name, signal);
    if (!own.name) {
      if (own.directory?.size) myResultsStatus.textContent = 'Bitte wähle deinen Namen aus.';
      return;
    }
    await showMyResultsFor(own.name, signal);
  } catch (error) {
    if (!signal.aborted) myResultsStatus.textContent = 'Ergebnisse konnten nicht geladen werden.';
  }
}

// Firestore-REST-Werte in normale Werte umwandeln (öffentlicher Lese-Weg).
function restValue(v) {
  if (!v || typeof v !== 'object') return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('timestampValue' in v) return v.timestampValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(restValue);
  if ('mapValue' in v) return Object.fromEntries(Object.entries(v.mapValue.fields || {}).map(([k, x]) => [k, restValue(x)]));
  return null;
}

async function overviewPyramid(db, firestore) {
  if (!(await readPyramidActive())) return null;
  try {
    const snapshot = await firestore.getDocFromServer(firestore.doc(db, 'soloPyramide', 'state'));
    if (snapshot.exists()) return snapshot.data();
  } catch {}
  const response = await fetch('https://firestore.googleapis.com/v1/projects/ec-wegscheid-verwaltung-neu/databases/(default)/documents/soloPyramide/state?mask.fieldPaths=fixedChallenges&mask.fieldPaths=players', {cache: 'no-store'});
  if (!response.ok) return null;
  const fields = (await response.json()).fields || {};
  return {fixedChallenges: restValue(fields.fixedChallenges) || [], players: restValue(fields.players) || []};
}

async function readCompetitionStatus(firestore, db) {

async function overviewReservations(user, db, firestore, today) {
  const permission = await readMemberPermissions(user.uid).catch(() => null);
  const registered = user.uid === 'n9MpiKXZNLap8wsbRcP4fVjrT4D2' || /^ecw-mobile-[a-f0-9]{32}$/.test(user.uid);
  if ((permission?.reservierungenLesen ?? registered) !== true) return [];
  const rows = [];
  try {
    const snapshot = await firestore.getDocFromServer(firestore.doc(db, 'reservierungMigration', 'buchungen_20261112'));
    for (const row of snapshot.data()?.list || []) rows.push(row);
  } catch {}
  try {
    const {getFunctions, httpsCallable} = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js');
    const call = httpsCallable(getFunctions(app, 'europe-west3'), 'ecwBahnreservierung');
    const days = Array.from({length: 14}, (_, i) => ECWMeinUeberblick.addDays(today, i));
    const results = await Promise.allSettled(days.map(date => withTimeout(call({action: 'list', date, view: 'reservierungen'}), 8000, null)));
    for (const result of results) {
      if (result.status !== 'fulfilled' || !result.value) continue;
      for (const b of result.value.data?.bookings || []) rows.push({...b, liveId: b.id});
    }
  } catch {}
  return rows;
}

const withTimeout = (promise, ms, fallback) => Promise.race([
  promise, new Promise(resolve => setTimeout(() => resolve(fallback), ms))
]);

  const user = auth.currentUser;

  const showMessage = (text, greeting = 'Servus!') => {
    overview.replaceChildren();
    const hi = document.createElement('p');
    hi.className = 'ov-hi';
    hi.textContent = greeting;
    const hint = document.createElement('p');
    hint.className = 'ov-sub';
    hint.textContent = text;
    overview.append(hi, hint);
  };
  try {
    const own = await withTimeout(ownMemberName(), 10000, {name: ''});
    if (!current()) return;
    const name = own.name;
    if (!name) {
      showMessage('Wähle unter „Meine Ergebnisse“ einmal deinen Namen, dann erscheint hier dein Überblick.');
      return;
    }
    const today = ECWMeinUeberblick.viennaToday();
    const firestore = await import(firestoreSdkUrl);
    const db = firestore.getFirestore(app);
    const [rows, planner, pyramid, status, cupTournaments, championship] = await Promise.all([
      withTimeout(overviewReservations(user, db, firestore, today).catch(() => []), 10000, []),
      withTimeout(firestore.getDocs(firestore.collection(db, 'tournamentPlanner'))
        .then(snapshot => snapshot.docs.map(entry => ({id: entry.id, data: entry.data()}))).catch(() => []), 10000, []),
      withTimeout(overviewPyramid(db, firestore).catch(() => null), 10000, null),
      withTimeout(readCompetitionStatus(firestore, db), 10000, {}),
      withTimeout(window.ecwLoadCupTournaments().catch(() => null), 10000, null),
      withTimeout(firestore.getDocFromServer(firestore.doc(db, 'turnierauswertung', 'jahresmeisterschaft'))
        .then(snapshot => snapshot.data()?.state || null).catch(() => null), 10000, null)
    ]);
    if (!current()) return;
    ECWMeinUeberblick.render(overview, name, {
      reservations: ECWMeinUeberblick.reservations(rows, name, today),
      challenge: pyramid ? ECWMeinUeberblick.openChallenge(pyramid, name) : null,
      tournaments: ECWMeinUeberblick.tournaments(planner, name, today),
      competitions: ECWMeinUeberblick.competitions(status, {
        cupTournaments, standings: window.ecwCupStandings, pyramid, championship
      }, name)
    }, today);
    overviewLoadedAt = Date.now();
  } catch (error) {
    console.warn('Mein Überblick konnte nicht geladen werden:', error);
    if (current()) showMessage('Der Überblick konnte gerade nicht geladen werden. Bitte später erneut öffnen.');
  }
}

function resultTableCopy(source, championship) {
  const table = document.createElement('table');
  table.setAttribute('aria-labelledby', 'result-heading');
  for (const [name, sourceSection] of [['thead', source.tHead], ['tbody', source.tBodies[0]]]) {
    if (!sourceSection) continue;
    const destination = name === 'thead' ? table.createTHead() : table.createTBody();
    for (const row of sourceSection.rows) {
      const cells = Array.from(row.cells);
      const selected = championship && cells.length > 5 ? [...cells.slice(0, 2), ...cells.slice(-3)] : cells;
      const newRow = destination.insertRow();
      for (const cell of selected) {
        const entry = document.createElement(name === 'thead' ? 'th' : 'td');
        if (name === 'thead') entry.scope = 'col';
        entry.textContent = cell.textContent.trim().replace(/\s+/g, ' ');
        newRow.append(entry);
      }
    }
  }
  return table;
}

// Read the same standings as the whiteboard using the existing member session.
function championshipRows(players) {
  const rows = players.map(p => {
    const rounds = Array.from({length: 6}, (_, i) => {
      const round = p.r?.[i];
      if (!round) return 0;
      const scores = Array.isArray(round) ? round : round.__ecwNestedArrayV1;
      if (!Array.isArray(scores) || !scores.every(Number.isFinite)) throw new Error('Ungültiges Ergebnis');
      return scores.reduce((a, b) => a + b, 0);
    });
    const total = rounds.reduce((a, b) => a + b, 0);
    const drop = Math.min(...rounds);
    return {name: p.n, total, drop, result: total - drop};
  }).sort((a, b) => b.result - a.result);
  let rank = 0, previous = null;
  rows.forEach((row, index) => {
    if (row.result !== previous) rank = index + 1;
    row.rank = rank;
    previous = row.result;
  });
  return rows;
}

async function readChampionship(signal) {
  const uid = auth.currentUser?.uid;
  if (!uid || signal.aborted) return;
  const {getFirestore, doc, getDocFromServer} = await import(firestoreSdkUrl);
  if (signal.aborted || auth.currentUser?.uid !== uid) return;
  const snapshot = await getDocFromServer(doc(getFirestore(app), 'turnierauswertung', 'jahresmeisterschaft'));
  if (signal.aborted || auth.currentUser?.uid !== uid) return;
  const players = snapshot.data()?.state?.players;
  if (!Array.isArray(players)) throw new Error('Keine Daten');
  const rows = championshipRows(players);
  const table = document.createElement('table');
  table.setAttribute('aria-labelledby', 'result-heading');
  const header = table.createTHead().insertRow();
  for (const label of ['Platz', 'Schütze', 'Gesamt', 'Streichresultat', 'Endergebnis']) {
    const cell = document.createElement('th');
    cell.scope = 'col';
    cell.textContent = label;
    header.append(cell);
  }
  const body = table.createTBody();
  for (const row of rows) {
    const tr = body.insertRow();
    for (const value of [row.rank, row.name, row.total, row.drop, row.result]) {
      tr.insertCell().textContent = value;
    }
  }
  resultTable.replaceChildren(table);
  resultStatus.textContent = rows.length ? '' : 'Keine Ergebnisse vorhanden.';
}

async function readResults(signal, championship) {
  let championshipLoaded = false;
  for (let attempt = 0; attempt < 50; attempt++) {
    await new Promise(resolve => setTimeout(resolve, 350));
    if (signal.aborted) return;
    const source = moduleFrame.contentDocument;
    if (!source) continue;
    let table;
    if (championship) {
      const child = source.querySelector('#view-jahresmeisterschaft.active #jahresmeisterschaftFrame');
      const importState = child?.contentWindow?.ECW_JM_IMPORT_STATE;
      const loadState = moduleFrame.contentWindow?.firebaseLoadJahresmeisterschaft;
      if (!championshipLoaded && importState && loadState) {
        const pack = await loadState();
        if (signal.aborted) return;
        if (!pack?.state) throw new Error('Keine Daten');
        importState(pack.state);
        championshipLoaded = true;
      }
      if (championshipLoaded) table = child?.contentDocument?.querySelector('#rang .tablebox table');
    } else {
      table = source.querySelector('#view-table.active .table-container table');
    }
    if (table?.tHead?.rows.length && (championshipLoaded || table.tBodies[0]?.rows.length)) {
      resultTable.replaceChildren(resultTableCopy(table, championship));
      resultStatus.textContent = '';
      return;
    }
  }
  throw new Error('Tabelle nicht verfügbar');
}

async function loadTemperatures(signal) {
  temperatureStatus.textContent = 'Temperaturen werden geladen …';
  for (const field of temperatureFields) {
    document.getElementById(field).textContent = '–';
    document.getElementById(field + '-humidity').textContent = '–';
  }
  try {
    const response = await fetch(temperatureUrl, {signal, cache: 'no-store'});
    if (!response.ok) throw new Error('Temperaturquelle nicht erreichbar');
    const {fields} = await response.json();
    if (signal.aborted) return;
    const updated = new Date(fields?.updatedAt?.timestampValue);
    if (!Number.isFinite(updated.getTime())) throw new Error('Messzeit fehlt');
    const age = Date.now() - updated.getTime();
    if (age > 10 * 60 * 1000 || age < -60 * 1000) {
      temperatureStatus.textContent = 'Keine aktuellen Messwerte. Letzter Stand: ' + dateFormat.format(updated) + ' Uhr.';
      return;
    }
    for (const field of temperatureFields) {
      const humidity = fields[field + '_luftfeuchte_prozent'];
      const percent = humidity?.doubleValue ?? Number(humidity?.integerValue);
      if (Number.isFinite(percent)) {
        document.getElementById(field + '-humidity').textContent = temperatureFormat.format(percent) + ' %';
      }
      const reading = fields[field];
      const value = reading?.doubleValue ?? Number(reading?.integerValue);
      if (Number.isFinite(value)) {
        document.getElementById(field).textContent = temperatureFormat.format(value) + ' °C';
      }
    }
    temperatureStatus.textContent = 'Stand: ' + dateFormat.format(updated) + ' Uhr.';
  } catch {
    if (!signal.aborted) temperatureStatus.textContent = 'Temperaturen derzeit nicht verfügbar.';
  }
}

function readActivationCode(value) {
  const input = value.trim();
  if (/^[A-Za-z0-9_-]{20,256}$/.test(input)) return input;
  try {
    const link = new URL(input);
    if (link.origin !== 'https://ecwegscheid.github.io' ||
        link.pathname !== '/Vereinsverwaltung-Aktuell/smartphone-mitglieder.html') return null;
    const code = new URLSearchParams(link.hash.slice(1)).get('aktivierung');
    return code && /^[A-Za-z0-9_-]{20,256}$/.test(code) ? code : null;
  } catch {
    return null;
  }
}

function loadMemberLogin() {
  return memberLoginRequest ??= (async () => {
    try {
      const {getFirestore, doc, getDocFromServer} = await import(firestoreSdkUrl);
      const snapshot = await getDocFromServer(doc(getFirestore(app), 'smartphoneAnmeldung', 'mitglieder'));
      const entries = snapshot.data()?.members;
      if (!Array.isArray(entries) || !entries.length) return;
      const directory = new Map();
      const aliases = new Set();
      for (const {name, alias} of entries) {
        if (typeof name !== 'string' || !name.trim() || typeof alias !== 'string' ||
            !/^[a-f0-9]{32}$/.test(alias) || directory.has(name.trim()) || aliases.has(alias)) return;
        directory.set(name.trim(), alias);
        aliases.add(alias);
      }
      const names = [...directory.keys()].sort((a, b) => a.localeCompare(b, 'de'));
      for (const name of names) memberName.add(new Option(name, name));
      memberDirectory = directory;
      document.getElementById('email-login').hidden = true;
      email.required = false;
      email.disabled = true;
      memberName.required = true;
      memberName.disabled = false;
      document.getElementById('member-login').hidden = false;
    } catch {
      // Keep the existing sign-in available while the directory is being provisioned.
      memberLoginRequest = undefined;
    }
  })();
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  error.hidden = true;
  submit.disabled = true;
  let checkingActivation = false;
  let keepStartPassword = false;
  try {
    await authReady;
    const alias = memberDirectory?.get(memberName.value);
    const identifier = memberDirectory ? (alias ? alias + '@login.ec-wegscheid.de' : '') : email.value.trim();
    let candidateCode = activationCode;
    if (!candidateCode && nameLoginEnabled && memberDirectory && password.value === '1234') {
      activationEntry.hidden = false;
      activationValue.disabled = false;
      candidateCode = readActivationCode(activationValue.value);
      if (!candidateCode) {
        keepStartPassword = true;
        loginError('Füge deinen persönlichen Aktivierungscode oder Link hier ein und klicke auf Weiter.');
        submit.textContent = 'Weiter';
        activationValue.focus();
        return;
      }
    }
    if (candidateCode && !activationEmail) {
      checkingActivation = true;
      if (!alias || password.value !== '1234') {
        loginError('Wähle deinen Namen und gib das Startpasswort 1234 ein.');
        return;
      }
      const verifiedEmail = await verifyPasswordResetCode(auth, candidateCode);
      if (verifiedEmail.toLowerCase() !== identifier.toLowerCase()) {
        loginError('Dieser Aktivierungscode gehört nicht zum ausgewählten Namen.');
        return;
      }
      activationCode = candidateCode;
      activationEmail = identifier;
      setActivationView(true);
      newPassword.focus();
      return;
    }
    if (activationCode && activationEmail) {
      if (newPassword.value !== repeatPassword.value) {
        loginError('Die beiden neuen Passwörter stimmen nicht überein.');
        return;
      }
      const chosenPassword = newPassword.value;
      await confirmPasswordReset(auth, activationCode, chosenPassword);
      activationCode = null;
      const verifiedEmail = activationEmail;
      activationEmail = null;
      newPassword.value = repeatPassword.value = '';
      setActivationView(false);
      const credential = await signInWithEmailAndPassword(auth, verifiedEmail, chosenPassword);
      void import(firestoreSdkUrl).then(({getFirestore, doc, setDoc, serverTimestamp}) =>
        setDoc(doc(getFirestore(app), 'smartphonePasswortstatus', credential.user.uid),
          {confirmedAt: serverTimestamp()})
      ).catch(error => console.warn('Passwortstatus konnte nicht bestätigt werden:', error.code));
    } else {
      await signInWithEmailAndPassword(auth, identifier, password.value);
    }
    document.getElementById('menu-title').focus();
  } catch (failure) {
    if (activationCode || checkingActivation) {
      loginError(failure.code === 'auth/weak-password' || failure.code === 'auth/password-does-not-meet-requirements'
        ? 'Wähle ein stärkeres Passwort.'
        : 'Aktivierung fehlgeschlagen. Prüfe den persönlichen Link oder lass dir einen neuen geben.');
    } else {
      loginError(memberDirectory ? 'Anmeldung fehlgeschlagen. Prüfe den ausgewählten Namen und das Passwort.' : 'Anmeldung fehlgeschlagen. Prüfe E-Mail und Passwort.');
    }
  } finally {
    if (!keepStartPassword) password.value = '';
    submit.disabled = false;
  }
});

      detailTitle.textContent = 'Ergebnisse Turniere Intern';
      cupDataRequest = new AbortController();
      cupData = window.ecwLoadCupTournaments(cupDataRequest.signal).catch(() => null);
    }
    if (title === 'Halle') {
      hallRequest = new AbortController();
      void loadTemperatures(hallRequest.signal);
    }
    menu.hidden = true;
    detail.hidden = false;
    detailTitle.focus();
  });
});

document.getElementById('back').addEventListener('click', () => {
  closeInvitations();
  stopCupPrefetch();
  hallRequest?.abort();
  plannerRequest?.abort();
  myResultsRequest?.abort();
  plannerList.replaceChildren();
  overview.hidden = true;
  detail.hidden = true;
  menu.hidden = false;
  selectedButton.focus();
});

// Browser erlauben das Schließen nur bei Fenstern, die per Skript geöffnet wurden.
// Sonst eine klare Abschlussseite statt einer leeren Seite zeigen.
const exitButton = document.getElementById('exit-member');
const inSubView = () => !modulePanel.hidden || !detail.hidden;
function backOneLevel() {
  if (!modulePanel.hidden) { closeModule(); return true; }
  if (!detail.hidden) { document.getElementById('back').click(); return true; }
  return false;
}
// Beschriftung passend halten: in Unterseiten "Zurück", im Menü "Beenden".
new MutationObserver(() => { exitButton.textContent = inSubView() ? 'Zurück' : 'Beenden'; })
  .observe(document.body, {subtree: true, attributes: true, attributeFilter: ['hidden']});
// Handy-Zurück-Taste: aus Unterseiten eine Ebene zurück ins Menü statt die App zu verlassen.
let subViewHistory = false;
new MutationObserver(() => {
  if (inSubView() && !subViewHistory) { history.pushState({ecwSubView: true}, ''); subViewHistory = true; }
  if (!inSubView() && subViewHistory && history.state?.ecwSubView) { subViewHistory = false; history.back(); }
  else if (!inSubView()) subViewHistory = false;
}).observe(document.body, {subtree: true, attributes: true, attributeFilter: ['hidden']});
window.addEventListener('popstate', () => {
  if (subViewHistory && inSubView()) { subViewHistory = false; backOneLevel(); }
});
exitButton.addEventListener('click', () => {
  if (backOneLevel()) return;
  hallRequest?.abort();
  plannerRequest?.abort();
  myResultsRequest?.abort();
  moduleFrame.removeAttribute('src');
  window.close();
  setTimeout(() => {
    if (window.closed) return;
    document.body.innerHTML = '';
    const box = document.createElement('main');
    box.style.cssText = 'min-height:100vh;display:grid;place-content:center;gap:16px;text-align:center;padding:24px';
    const title = document.createElement('h1');
    title.textContent = 'Mitgliederbereich beendet';
    const hint = document.createElement('p');
    hint.textContent = 'Du kannst die App bzw. den Browser-Tab jetzt schließen. Du bleibst angemeldet.';
    const again = document.createElement('button');
    again.type = 'button';
    again.textContent = 'Wieder öffnen';
    again.addEventListener('click', () => location.reload());
    box.append(title, hint, again);
    document.body.append(box);
  }, 250);
});

document.getElementById('logout').addEventListener('click', async () => {
  try {
    await signOut(auth);
    (memberDirectory ? memberName : email).focus();
  } catch {
    window.alert('Abmeldung fehlgeschlagen. Bitte erneut versuchen.');
  }
});
</script>
