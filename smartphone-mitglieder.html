<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141416">
<title>EC Wegscheid · Mitgliederbereich</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;color:#fff;font:16px system-ui,sans-serif;background:radial-gradient(ellipse at top,#4b171b,transparent 57%),repeating-linear-gradient(135deg,#151517 0 3px,#19191c 3px 6px)}
main{max-width:490px;margin:auto;padding:clamp(28px,8vh,80px) 20px 40px}
header{display:flex;align-items:center;gap:14px;margin-bottom:38px}
.mark{display:grid;place-items:center;background:#b91f2e;border-radius:12px;width:48px;height:48px;font-weight:850}
header strong{font-size:21px}
header small{display:block;color:#e4bec1;margin-top:3px}
section{background:#202023;border:1px solid #454045;border-radius:20px;padding:clamp(18px,5vw,28px);box-shadow:0 18px 50px #0005}
h1{font-size:clamp(24px,6vw,32px);margin:0 0 20px;line-height:1.15}
label{display:block;margin-bottom:8px;font-weight:650}
input,button{font:inherit;border-radius:10px;min-height:48px;width:100%}
input{background:#151517;border:1px solid #77717a;padding:12px;color:white}
button{cursor:pointer;color:white;background:#b91f2e;border:1px solid transparent;padding:12px;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid #ffb9bf;outline-offset:3px}
form button,.password-label{margin-top:14px}
p{line-height:1.5;color:#ddd5d8}
.hint{font-size:14px;margin:14px 0 0}
#error{color:#ffb9bf}
nav{display:grid;gap:10px}
nav button,.reservation-link{display:flex;justify-content:space-between;align-items:center;background:#2c292d;border-color:#4c4248;text-align:left;min-height:58px;padding-inline:16px}
.reservation-link{border:1px solid #4c4248;border-radius:10px;color:white;font-weight:700;text-decoration:none}
.reservation-link:focus-visible{outline:3px solid #ffb9bf;outline-offset:3px}
nav button:hover,.reservation-link:hover{background:#42282e}
.arrow{color:#ffaeb6;font-size:24px;line-height:1}
.secondary{background:transparent;border-color:#6f626b;margin-top:18px}
.hall-status{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid #665047;border-radius:10px;background:#302725}
.hall-status strong{color:#ffd2a9}
.temperature-title{font-size:18px;margin:20px 0 8px}
.readings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0}
.readings div{background:#2c292d;border:1px solid #4c4248;border-radius:10px;padding:10px 5px;text-align:center}
.readings dt{font-size:clamp(11px,3vw,14px);color:#e9d7db}
.readings dd{margin:6px 0 0;font-size:clamp(14px,4vw,20px);font-weight:750;white-space:nowrap}
#detail{margin-bottom:calc(74px + env(safe-area-inset-bottom, 0px))}
.detail-nav{position:fixed;inset:auto 0 0;z-index:4;display:flex;justify-content:center;padding:8px max(12px,env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px,env(safe-area-inset-left, 0px));background:#202023;border-top:1px solid #51434b}
#back{min-height:54px;max-width:450px;margin:0;background:#b91f2e;border-color:transparent}
#module{position:fixed;inset:0;z-index:5;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:0;border:0;border-radius:0;background:#151517}
#module iframe{width:100%;height:100%;border:0;background:#202023}
.module-nav{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 12px max(8px,env(safe-area-inset-bottom));background:#202023;border-top:1px solid #51434b}
.module-nav button{min-height:52px}
#module.is-results .module-nav{grid-template-columns:minmax(0,1fr)}
#result-reader{min-width:0;overflow-y:auto;padding:12px max(8px,env(safe-area-inset-right,0px)) 16px max(8px,env(safe-area-inset-left,0px))}
#result-reader h1{font-size:clamp(18px,5vw,26px);margin:0 0 12px}
#result-reader table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:clamp(11px,3.1vw,15px)}
#result-reader th,#result-reader td{padding:6px 2px;border-bottom:1px solid #4c4248;text-align:center;overflow-wrap:anywhere;vertical-align:top}
#result-reader th{background:#63202a}
#result-reader :is(th,td):nth-child(2){width:32%;text-align:left}
#result-reader :is(th,td):first-child{width:9%}
#result-reader :is(th,td):nth-child(2){padding-left:4px}
.module-nav a{display:grid;place-items:center;color:#fff;padding-inline:10px;font-size:14px}
#results button{text-align:left}
#planner-list{display:grid;gap:8px}
.planner-event{padding:10px 12px;background:#2c292d;border:1px solid #4c4248;border-radius:10px;overflow-wrap:anywhere}
.planner-event h2{font-size:16px;margin:3px 0 7px}
.planner-event time,.planner-event dt{color:#e9d7db;font-size:12px}
.planner-event dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 10px;margin:0}
.planner-event dd{margin:0;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><span class="mark" aria-hidden="true">EC</span><div><strong>EC Wegscheid</strong><small>Mitgliederbereich</small></div></header>
<p id="session-check" class="hint" role="status">Anmeldung wird geprüft …</p>
<section id="login" aria-labelledby="login-title" hidden>
<h1 id="login-title">Anmelden</h1>
<form id="form">
<label for="email">E-Mail</label>
<input id="email" type="email" autocomplete="username" required>
<label class="password-label" for="password">Passwort</label>
<input id="password" type="password" autocomplete="current-password" aria-describedby="error" required>
<button>Anmelden</button>
<p class="hint" id="error" role="alert" hidden></p>
</form>
</section>
<section id="menu" aria-labelledby="menu-title" hidden>
<h1 id="menu-title" tabindex="-1">Hauptmenü</h1>
<nav aria-label="Hauptmenü">
<button type="button" data-mobile-feature="reservation">Reservierungssystem<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="planner">Terminplaner<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="hall">Halle<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="games">Spiele<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="tables">Tabellen<span class="arrow" aria-hidden="true">›</span></button>
<button type="button" data-mobile-feature="solo">Solo Pyramide<span class="arrow" aria-hidden="true">›</span></button>
</nav>
<button type="button" class="secondary" id="logout">Abmelden</button>
</section>
<section id="detail" aria-labelledby="detail-title" hidden>
<h1 id="detail-title" tabindex="-1"></h1>
<nav id="results" aria-label="Tabellen" hidden>
<button type="button" data-result="cup" data-cup="duo">Duo Cup</button>
<button type="button" data-result="cup" data-cup="frauen">Frauencup</button>
<button type="button" data-result="jahresmeisterschaft">Ziel Jahresmeisterschaft</button>
</nav>
<div id="planner-panel" hidden>
<p id="planner-status" class="hint" role="status"></p>
<div id="planner-list"></div>
</div>
<div id="hall-panel" hidden>
<div class="hall-status"><span>Hallenstatus</span><strong>Unbekannt</strong></div>
<h2 class="temperature-title">Temperaturanzeige</h2>
<dl class="readings">
<div><dt>Außen</dt><dd id="aussen">–</dd></div>
<div><dt>Halle</dt><dd id="halle">–</dd></div>
<div><dt>Vereinsheim</dt><dd id="vereinsheim">–</dd></div>
</dl>
<p class="hint" id="temperature-status" role="status"></p>
</div>
<div class="detail-nav"><button type="button" id="back">← Zurück zum Hauptmenü</button></div>
</section>
<section id="module" aria-label="Vereinsmodul" hidden>
<iframe id="module-frame" title="Vereinsmodul" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="result-reader" hidden><h1 id="result-heading"></h1><p id="result-status" role="status"></p><div id="result-table"></div></div>
<div class="module-nav">
<button type="button" id="module-back">← Zurück zum Hauptmenü</button>
<a id="module-external" target="_blank" rel="noopener">Separat öffnen ↗</a>
</div>
</section>
</main>
<script src="ecw-smartphone-einstellungen.js?v=4"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
const firebaseConfig={
  apiKey:"AIzaSyDmK54G30_JK8ma8tJ7YWyza-OrdrUC24I",
  authDomain:"ec-wegscheid-verwaltung-neu.firebaseapp.com",
  projectId:"ec-wegscheid-verwaltung-neu",
  storageBucket:"ec-wegscheid-verwaltung-neu.firebasestorage.app",
  messagingSenderId:"558472054725",
  appId:"1:558472054725:web:10145e2d8d6f168b056dac"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const firestoreSdkUrl = 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
const authReady = setPersistence(auth, browserLocalPersistence);

const login = document.getElementById('login');
const sessionCheck = document.getElementById('session-check');
const menu = document.getElementById('menu');
const detail = document.getElementById('detail');
const password = document.getElementById('password');
const error = document.getElementById('error');
const detailTitle = document.getElementById('detail-title');
const hallPanel = document.getElementById('hall-panel');
const plannerPanel = document.getElementById('planner-panel');
const plannerStatus = document.getElementById('planner-status');
const plannerList = document.getElementById('planner-list');
let plannerRequest;
const plannerClock = new Intl.DateTimeFormat('sv-SE', {
  timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
});

function plannerDate(value) {
  const raw = String(value || '').trim();
  const iso = raw.match(/^\d{4}-\d{2}-\d{2}/);
  if (iso) return iso[0];
  const parts = raw.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
  return parts ? parts[3] + '-' + parts[2].padStart(2, '0') + '-' + parts[1].padStart(2, '0') : '';
}

function upcomingEvents(events, now = new Date()) {
  const parts = Object.fromEntries(plannerClock.formatToParts(now).map(({type, value}) => [type, value]));
  const today = parts.year + '-' + parts.month + '-' + parts.day;
  const currentTime = parts.hour + ':' + parts.minute;
  return events.map(event => {
    const time = String(event.time || '').trim().match(/^([01]?\d|2[0-3]):([0-5]\d)(?::[0-5]\d)?$/);
    return {
      ...event,
      date: plannerDate(event.date),
      time: time ? time[1].padStart(2, '0') + ':' + time[2] : ''
    };
  }).filter(event => event.date > today || (event.date === today && event.time > currentTime))
    .sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time) ||
      String(a.name || '').localeCompare(String(b.name || ''), 'de'));
}

function plannerEventCard(event) {
  const card = document.createElement('article');
  card.className = 'planner-event';
  const date = document.createElement('time');
  date.dateTime = event.date;
  date.textContent = event.date.split('-').reverse().join('.') + (event.time ? ' · ' + event.time + ' Uhr' : '');
  const title = document.createElement('h2');
  title.textContent = event.name || 'Termin ohne Bezeichnung';
  const fields = document.createElement('dl');
  const values = [['Ort', event.location]];
  const type = String(event.type || '').trim().toLowerCase();
  if (type === 'turnier' || type === 'meisterschaft') {
    values.push(['Gemeldet von', event.reportedBy]);
    for (let index = 0; index < 4; index++) {
      values.push(['Spieler ' + (index + 1), event.players?.[index]]);
    }
  }
  for (const [label, value] of values) {
    const row = document.createElement('div');
    const term = document.createElement('dt');
    const description = document.createElement('dd');
    term.textContent = label;
    description.textContent = String(value || '').trim() || '–';
    row.append(term, description);
    fields.append(row);
  }
  card.append(date, title, fields);
  return card;
}

async function readSmartphoneSettings() {
  try {
    const {getFirestore, doc, getDoc} = await import(firestoreSdkUrl);
    const snapshot = await getDoc(doc(getFirestore(app), 'appSettings', ECWSmartphoneNavigation.documentName));
    return snapshot.data();
  } catch {
    return undefined;
  }
}

async function loadPlanner(signal) {
  plannerList.replaceChildren();
  plannerStatus.textContent = 'Termine werden geladen …';
  try {
    const {getFirestore, collection, getDocs} = await import(firestoreSdkUrl);
    if (signal.aborted || !auth.currentUser) return;
    const snapshot = await getDocs(collection(getFirestore(app), 'tournamentPlanner'));
    if (signal.aborted) return;
    const events = upcomingEvents(snapshot.docs.map(doc => doc.data()));
    plannerStatus.textContent = events.length ? '' : 'Keine zukünftigen Termine.';
    plannerList.replaceChildren(...events.map(plannerEventCard));
  } catch (error) {
    if (signal.aborted) return;
    plannerStatus.textContent = error.code === 'permission-denied'
      ? 'Der Terminplaner ist für dieses Konto nicht freigegeben.'
      : 'Termine konnten nicht geladen werden.';
  }
}
const temperatureStatus = document.getElementById('temperature-status');
const temperatureFields = ['aussen', 'halle', 'vereinsheim'];
const temperatureUrl = 'https://firestore.googleapis.com/v1/projects/ecw-technik/databases/(default)/documents/temperaturen/aktuell';
const temperatureFormat = new Intl.NumberFormat('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const dateFormat = new Intl.DateTimeFormat('de-DE', {dateStyle: 'short', timeStyle: 'short', timeZone: 'Europe/Berlin'});
let selectedButton;
let hallRequest;
const results = document.getElementById('results');
const modulePanel = document.getElementById('module');
const moduleFrame = document.getElementById('module-frame');
const moduleBack = document.getElementById('module-back');
const reservationUrl = new URLSearchParams(location.search).get('reservierungTest') === '1'
  ? new URL('reservierung-smartphone-test.html', location.href).href
  : 'https://ecwegscheid.github.io/Reservierungssystem/';
const gamesUrl = new URL('?ansicht=tag', reservationUrl);
const administrationUrl = 'https://ecwegscheid.github.io/Vereinsverwaltung-Aktuell/';
const soloUrl = new URL('solo-pyramide.html?v=2.5.2', administrationUrl);

const moduleExternal = document.getElementById('module-external');
const resultReader = document.getElementById('result-reader');
const resultHeading = document.getElementById('result-heading');
const resultStatus = document.getElementById('result-status');
const resultTable = document.getElementById('result-table');
let resultRequest;

function resultTableCopy(source, championship) {
  const table = document.createElement('table');
  table.setAttribute('aria-labelledby', 'result-heading');
  for (const [name, sourceSection] of [['thead', source.tHead], ['tbody', source.tBodies[0]]]) {
    if (!sourceSection) continue;
    const destination = name === 'thead' ? table.createTHead() : table.createTBody();
    for (const row of sourceSection.rows) {
      const cells = Array.from(row.cells);
      const selected = championship && cells.length > 5 ? [...cells.slice(0, 2), ...cells.slice(-3)] : cells;
      const newRow = destination.insertRow();
      for (const cell of selected) {
        const entry = document.createElement(name === 'thead' ? 'th' : 'td');
        if (name === 'thead') entry.scope = 'col';
        entry.textContent = cell.textContent.trim().replace(/\s+/g, ' ');
        newRow.append(entry);
      }
    }
  }
  return table;
}

async function readResults(signal, championship) {
  let championshipLoaded = false;
  for (let attempt = 0; attempt < 50; attempt++) {
    await new Promise(resolve => setTimeout(resolve, 350));
    if (signal.aborted) return;
    const source = moduleFrame.contentDocument;
    if (!source) continue;
    let table;
    if (championship) {
      const child = source.querySelector('#view-jahresmeisterschaft.active #jahresmeisterschaftFrame');
      const importState = child?.contentWindow?.ECW_JM_IMPORT_STATE;
      const loadState = moduleFrame.contentWindow?.firebaseLoadJahresmeisterschaft;
      if (!championshipLoaded && importState && loadState) {
        const pack = await loadState();
        if (signal.aborted) return;
        if (!pack?.state) throw new Error('Keine Daten');
        importState(pack.state);
        championshipLoaded = true;
      }
      if (championshipLoaded) table = child?.contentDocument?.querySelector('#rang .tablebox table');
    } else {
      table = source.querySelector('#view-table.active .table-container table');
    }
    if (table?.tHead?.rows.length && (championshipLoaded || table.tBodies[0]?.rows.length)) {
      resultTable.replaceChildren(resultTableCopy(table, championship));
      resultStatus.textContent = '';
      return;
    }
  }
  throw new Error('Tabelle nicht verfügbar');
}

function closeResults() {
  resultRequest?.abort();
  resultTable.replaceChildren();
}

function showModule(title, url, readOnly = false, embeddedPage = false) {
  menu.hidden = true;
  detail.hidden = true;
  closeResults();
  modulePanel.classList.toggle('is-results', readOnly || embeddedPage);
  moduleFrame.hidden = readOnly;
  moduleExternal.hidden = readOnly || embeddedPage;
  resultReader.hidden = !readOnly;
  moduleFrame.title = title;
  if (readOnly) {
    resultHeading.textContent = title;
    resultStatus.textContent = 'Tabelle wird geladen …';
    resultReader.scrollTop = 0;
    moduleFrame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
  } else {
    moduleFrame.removeAttribute('sandbox');
    moduleExternal.href = url;
  }
  moduleFrame.src = url;
  modulePanel.hidden = false;
  moduleBack.focus();
  if (readOnly) {
    resultRequest = new AbortController();
    const {signal} = resultRequest;
    readResults(signal, url.searchParams.get('seite') === 'jahresmeisterschaft')
      .catch(() => {
        if (!signal.aborted) resultStatus.textContent = 'Die Tabelle konnte nicht geladen werden oder ist für dieses Konto nicht freigegeben.';
      })
      .finally(() => {
        if (!signal.aborted) moduleFrame.removeAttribute('src');
      });
  }
}

moduleBack.addEventListener('click', () => {
  closeResults();
  modulePanel.hidden = true;
  moduleFrame.removeAttribute('src');
  menu.hidden = false;
  selectedButton.focus();
});

results.querySelectorAll('button').forEach(button => {
  button.addEventListener('click', () => {
    const result = button.dataset.result;
    const url = new URL('turnierauswertung.html?v=2.5.2&seite=' + result, administrationUrl);
    if (button.dataset.cup) url.searchParams.set("cup", button.dataset.cup);
    showModule(button.textContent, url, true);
  });
});

async function loadTemperatures(signal) {
  temperatureStatus.textContent = 'Temperaturen werden geladen …';
  temperatureFields.forEach(field => { document.getElementById(field).textContent = '–'; });
  try {
    const response = await fetch(temperatureUrl, {signal, cache: 'no-store'});
    if (!response.ok) throw new Error('Temperaturquelle nicht erreichbar');
    const {fields} = await response.json();
    if (signal.aborted) return;
    const updated = new Date(fields?.aktualisiert?.timestampValue);
    if (!Number.isFinite(updated.getTime())) throw new Error('Messzeit fehlt');
    const age = Date.now() - updated.getTime();
    if (age > 15 * 60 * 1000 || age < -60 * 1000) {
      temperatureStatus.textContent = 'Keine aktuellen Messwerte. Letzter Stand: ' + dateFormat.format(updated) + ' Uhr.';
      return;
    }
    for (const field of temperatureFields) {
      const reading = fields[field];
      const value = reading?.doubleValue ?? Number(reading?.integerValue);
      if (Number.isFinite(value)) {
        document.getElementById(field).textContent = temperatureFormat.format(value) + ' °C';
      }
    }
    temperatureStatus.textContent = 'Stand: ' + dateFormat.format(updated) + ' Uhr.';
  } catch {
    if (!signal.aborted) temperatureStatus.textContent = 'Temperaturen derzeit nicht verfügbar.';
  }
}

const form = document.getElementById('form');
const email = document.getElementById('email');
const submit = form.querySelector('button');

function loginError(message) {
  error.textContent = message;
  error.hidden = false;
}

onAuthStateChanged(auth, async user => {
  if (user) {
    const settings = await readSmartphoneSettings();
    if (auth.currentUser?.uid !== user.uid) return;
    ECWSmartphoneNavigation.applyMembers(settings, (title, url, button) => {
      selectedButton = button;
      showModule(title, url, false, true);
    });
    login.hidden = true;
    sessionCheck.hidden = true;
    if (detail.hidden && modulePanel.hidden) menu.hidden = false;
    return;
  }
  hallRequest?.abort();
  plannerRequest?.abort();
  plannerList.replaceChildren();
  closeResults();
  modulePanel.hidden = true;
  moduleFrame.removeAttribute('src');
  detail.hidden = true;
  menu.hidden = true;
  sessionCheck.hidden = true;
  login.hidden = false;
});

form.addEventListener('submit', async event => {
  event.preventDefault();
  error.hidden = true;
  submit.disabled = true;
  try {
    await authReady;
    await signInWithEmailAndPassword(auth, email.value.trim(), password.value);
    document.getElementById('menu-title').focus();
  } catch {
    loginError('Anmeldung fehlgeschlagen. Prüfe E-Mail und Passwort.');
  } finally {
    password.value = '';
    submit.disabled = false;
  }
});

menu.querySelectorAll('nav button').forEach(button => {
  button.addEventListener('click', () => {
    selectedButton = button;
    detailTitle.textContent = button.firstChild.textContent.trim();
    const title = detailTitle.textContent;
    if (title === 'Reservierungssystem' || title === 'Spiele') {
      showModule(title, title === 'Spiele' ? gamesUrl : reservationUrl);
      return;
    }
    if (title === 'Solo Pyramide') {
      showModule(title, soloUrl);
      return;
    }
    hallPanel.hidden = title !== 'Halle';
    plannerPanel.hidden = title !== 'Terminplaner';
    if (title === 'Terminplaner') {
      plannerRequest = new AbortController();
      void loadPlanner(plannerRequest.signal);
    }
    results.hidden = title !== 'Tabellen';
    if (title === 'Tabellen') detailTitle.textContent = 'Ergebnisse Turniere Intern';
    if (title === 'Halle') {
      hallRequest = new AbortController();
      void loadTemperatures(hallRequest.signal);
    }
    menu.hidden = true;
    detail.hidden = false;
    detailTitle.focus();
  });
});

document.getElementById('back').addEventListener('click', () => {
  hallRequest?.abort();
  plannerRequest?.abort();
  plannerList.replaceChildren();
  detail.hidden = true;
  menu.hidden = false;
  selectedButton.focus();
});

document.getElementById('logout').addEventListener('click', async () => {
  try {
    await signOut(auth);
    email.focus();
  } catch {
    window.alert('Abmeldung fehlgeschlagen. Bitte erneut versuchen.');
  }
});
</script>
</body>
</html>
