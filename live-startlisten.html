<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0f13;font-family:Arial,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
#paperWrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden}
.paper{width:210mm;height:297mm;min-height:297mm;background:#fff;color:#111;box-shadow:0 7px 28px rgba(0,0,0,.48);padding:2mm 25mm 18mm;font-family:Calibri,Arial,sans-serif;transform-origin:center center;overflow:hidden}
.start-header{text-align:center;height:53.54mm;display:flex;align-items:center;justify-content:center}
.start-header img{width:87.84mm;height:53.54mm;object-fit:contain;display:block}
.start-title{font-size:25pt;font-weight:700;font-style:italic;text-decoration:underline;text-align:center;margin:1mm -12mm 11mm;line-height:1.08}
.start-date{text-align:center;font-size:18pt;font-style:italic;margin:0 0 12mm}
.start-entries{margin:0;width:100%;table-layout:fixed;border-collapse:collapse}
.start-entries td{font-size:15pt;line-height:1.1;border:0;padding:.85mm 0;vertical-align:top;color:#111;opacity:1}
.start-entries td:first-child{width:7mm}
.start-entries td:nth-child(2){padding-right:3mm;overflow-wrap:anywhere;font-weight:600}
.start-entries td:last-child{width:45mm;text-align:right;white-space:nowrap}
.start-free td:nth-child(2){color:#555;font-style:italic;font-weight:500}
.start-registration{text-align:center;margin:10mm 0 5mm;font-size:15pt}
.start-closing{text-align:center;margin:0;font-size:15pt}
.live{display:inline-block;margin-left:8px;padding:2px 8px;background:#b51f2b;color:#fff;border-radius:999px;font-size:10px;vertical-align:middle;text-decoration:none}
.empty{color:#d6d9de;font-size:22px;text-align:center;padding:30px}
.paper.rows-15-20 .start-header{height:43mm}
.paper.rows-15-20 .start-header img{height:43mm;width:72mm}
.paper.rows-15-20 .start-title{font-size:22pt;margin-bottom:7mm}
.paper.rows-15-20 .start-date{font-size:16pt;margin-bottom:8mm}
.paper.rows-15-20 .start-entries td{font-size:13.5pt;padding:.55mm 0}
.paper.rows-15-20 .start-registration{margin-top:7mm;font-size:13.5pt}
.paper.rows-15-20 .start-closing{font-size:13.5pt}
.paper.rows-21plus{padding-top:1mm;padding-bottom:10mm}
.paper.rows-21plus .start-header{height:34mm}
.paper.rows-21plus .start-header img{height:34mm;width:58mm}
.paper.rows-21plus .start-title{font-size:19pt;margin:0 -10mm 5mm}
.paper.rows-21plus .start-date{font-size:14pt;margin-bottom:5mm}
.paper.rows-21plus .start-entries td{font-size:11.5pt;line-height:1.02;padding:.33mm 0}
.paper.rows-21plus .start-registration{margin:5mm 0 3mm;font-size:11.5pt}
.paper.rows-21plus .start-closing{font-size:11.5pt}
</style>

const app=initializeApp(firebaseConfig),db=getFirestore(app);
const wrap=document.getElementById('paperWrap');
const wantedId=new URLSearchParams(location.search).get('turnier')||'';
let items=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(iso){if(!iso)return'';const p=String(iso).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:String(iso)}
function longDate(iso){if(!iso)return'';try{return new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(new Date(iso+'T12:00:00'))}catch(e){return fmtDate(iso)}}
function reportTime(x){return x.uhrzeit?('um '+x.uhrzeit+' Uhr'):''}
function rows(x){
 const e=Array.isArray(x.entries)?x.entries:[];
 const max=Math.max(0,Number(x.maxMannschaften)||0);
 const count=max||e.length;
 return Array.from({length:count},(_,i)=>e[i]||{free:true});
}
function safeLogo(v){return typeof v==='string'&&v.startsWith('data:image/')?v:DEFAULT_START_LOGO}
function fitPaper(){
 const paper=wrap.querySelector('.paper');if(!paper)return;
 paper.style.transform='none';
 requestAnimationFrame(()=>{
   const maxW=Math.max(100,wrap.clientWidth-8),maxH=Math.max(100,wrap.clientHeight-8);
   const scale=Math.min(maxW/paper.offsetWidth,maxH/paper.offsetHeight,1);
   paper.style.transform='scale('+scale+')';
 });
}
function render(){
 const x=items.find(v=>v.id===wantedId)||(!wantedId&&items[0]);
 if(!x){wrap.innerHTML='<div class="empty">'+(items.length?'Die gewählte Startliste wurde nicht gefunden.':'Noch keine Live-Startliste verfügbar.')+'</div>';return}
 const r=rows(x),tpl=x.vorlage||{};
 const title='Startliste '+(x.name||'Turnier')+(/EC[ -]?Wegscheid/i.test(x.name||'')?'':' EC Wegscheid');
 const rowClass=r.length>=21?'rows-21plus':(r.length>=15?'rows-15-20':'');
 wrap.innerHTML=`<article class="paper ${rowClass}">
   <div class="start-header"><img alt="EC Wegscheid Logo" src="${safeLogo(tpl.logo)}"></div>
   <h2 class="start-title">${esc(title)} <span class="live">LIVE</span></h2>
   <p class="start-date">am ${esc(longDate(x.datum))} ${esc(reportTime(x))}</p>
   <table class="start-entries"><tbody>${r.map((m,i)=>{
     const nr=i+1;
     if(m.free)return `<tr class="start-free"><td>${nr}.</td><td>Freier Startplatz</td><td></td></tr>`;
     return `<tr><td>${nr}.</td><td>${esc(m.vereinName||'')}${m.teamZusatz?' · '+esc(m.teamZusatz):''}</td><td>${m.anmeldedatum?'gem. am '+esc(fmtDate(m.anmeldedatum)):''}</td></tr>`;
   }).join('')}</tbody></table>
   <p class="start-registration">${tpl.einschreibung==='auto'||!tpl.einschreibung?'Meldung '+(x.meldeUhrzeit?('ab '+esc(x.meldeUhrzeit)+' Uhr'):'½ Stunde vor Turnierbeginn'):'Meldung '+esc(tpl.einschreibung)}</p>
   <p class="start-closing">${esc(tpl.startGruss||'Der EC-Wegscheid wünscht viel Erfolg beim Turnier!')}</p>
 </article>`;
 fitPaper();
}
window.addEventListener('resize',fitPaper);
onSnapshot(query(collection(db,'liveStartlisten')),snap=>{
 items=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.datum||'9999').localeCompare(b.datum||'9999')||(a.name||'').localeCompare(b.name||''));
 render();
},err=>{console.error(err);wrap.innerHTML='<div class="empty">Live-Startliste konnte nicht geladen werden.</div>'});
</script>
</body>
